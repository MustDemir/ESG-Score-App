# Bewertung:
#   likelihood: L (low) | M (medium) | H (high)
#   impact:     L | M | H
#   score:      grobe Multiplikation (L=1, M=2, H=3) → 1-9
# Status:
#   open       — aktiv, noch nicht entschärft
#   mitigated  — Maßnahme läuft, Restrisiko vertretbar
#   accepted   — Risiko bewusst akzeptiert
#   closed     — nicht mehr relevant

risks:
  - id: RISK-001
    title: Open Food Facts Datenqualität unzureichend für DE-Produkte
    likelihood: M
    impact: H
    score: 6
    description: |
      Wenn 30%+ der DE-Eigenmarken (Rewe, Edeka, Aldi) keine ESG-relevanten
      Felder haben, kippt das MVP-Versprechen.
    mitigation: |
      API-Spike durchgeführt am 2026-05-19 (siehe spikes/off-api-2026-05-19.md):
      - 20/20 kuratierte EANs in OFF gefunden
      - E-Säule 100% berechenbar (Eco-Score 70%, Fallback via Packaging/Agribalyse)
      - S-Säule 95% berechenbar (via labels_tags + origins)
      - WARNUNG: Spike-EANs wurden VIA OFF-SEARCH gefunden — Selection Bias!
        Zufällig gescannte DE-Produkte haben vermutlich schlechtere Coverage.
      - Original-EAN-Liste (Alnatura/GEPA/Hipp/Rewe-Bio) war zu 90% NICHT
        in OFF — das ist das echte Risiko.

      Restmaßnahmen offen:
      - Edge-Case-UX "Keine Daten verfügbar" + Hinweis User-Beitrag
      - Top-100-DE-Produkte selbst manuell pflegen (Hybrid-Strategie)
      - Eco-Score-Fallback: bei "unknown" nicht 0 zeigen sondern transparenter
        Hinweis "Daten unvollständig"
    related_todos: [TODO-001, TODO-011]
    related_gaps: [GAP-007]
    related_decisions: [0003]
    related_spikes: [off-api-2026-05-19.md]
    status: mitigated
    owner: Mustafa
    created: 2026-05-19
    updated: 2026-08-10

  - id: RISK-002
    title: Apple Developer Account Verifizierung verzögert TestFlight
    likelihood: L
    impact: M
    score: 2
    description: |
      Apple-Verifizierung dauert 24-48h, bei Business-Accounts auch 1-2 Wochen.
      Verzögert TestFlight-Launch falls erst spät beantragt.
    mitigation: |
      Account wurde gekauft und verifiziert. Signing, Installation und Start
      auf dem physischen iPhone wurden erfolgreich nachgewiesen. TestFlight
      bleibt bewusst außerhalb des aktuellen Entwicklungsumfangs.
    related_todos: [TODO-003]
    status: closed
    owner: Mustafa
    created: 2026-05-19
    updated: 2026-08-10

  - id: RISK-003
    title: ESG-Score-Formel nicht wissenschaftlich fundiert
    likelihood: M
    impact: H
    score: 6
    description: |
      Eigene ESG-Formel kann als willkürlich oder unseriös wahrgenommen
      werden — Glaubwürdigkeitsproblem, mögliche rechtliche Risiken
      (irreführende Werbung).
    mitigation: |
      Methodik v1.0 bleibt als heuristischer MVP gekennzeichnet. Methodik
      2.0-draft ist nicht score-aktiv; Missing-Data-, Red-Flag-,
      Reproducibility- und Claim-Safety-Gates verhindern Scheingenauigkeit.
      Offen bleiben Referenzkorpus, Normalisierung, Gewichtung,
      Sensitivitätsanalyse und unabhängiges Fachreview.
    related_todos: [TODO-002]
    related_gaps: [GAP-001]
    related_improvements: [IMP-DEV-003]
    status: open
    owner: Mustafa
    created: 2026-05-19
    updated: 2026-08-10

  - id: RISK-004
    title: Solo-Founder-Burnout / Time-to-MVP überschritten
    likelihood: M
    impact: H
    score: 6
    description: |
      Klassisches Solo-Founder-Risiko: Scope-Creep, Perfektionismus,
      Demotivation nach Hype-Phase. Wenn MVP nicht bis Juli steht,
      sinkt die Wahrscheinlichkeit dass es überhaupt fertig wird stark.
    mitigation: |
      Strikte Phase-1-Scope (out_of_scope-Liste in roadmap.yaml).
      Wöchentliches Progress-Tracking (progress.yaml).
      Bei Blockern: Lieber simpler Hack als perfekte Lösung.
    status: open
    owner: Mustafa
    created: 2026-05-19

  - id: RISK-005
    title: DSGVO / Privacy-Setup unvollständig
    likelihood: M
    impact: H
    score: 6
    description: |
      Eine Abweichung zwischen realem Datenfluss, Datenschutzerklärung, Apple
      App Privacy Details, Rechtsgrundlage oder Provider-Verträgen kann zu
      Datenschutzverstößen und App-Store-Ablehnung führen.
    mitigation: |
      Aktueller lokaler MVP verwendet kein Konto, kein Analytics-SDK und kein
      aktiviertes Remote-Backend. Das separate Frankfurter Development-Projekt
      ist provisioniert, aber Schema, App-Zugriff und Personendaten sind
      deaktiviert. Dateninventar, aktueller/geplanter Datenfluss,
      Privacy Manifest, SDK-Audit und G-PRIVACY-BOUNDARY bestehen im
      Development-Profil. Externe Beta und Remote-Backend bleiben bis
      DPA-/Subprocessor-Owner-Freigabe, qualifiziertem Rechts-/DPIA-Review,
      App Privacy, Retention,
      Betroffenenrechten, Löschung und Incident-Prozess blockiert.
    related_todos: [TODO-008]
    related_gaps: [GAP-004]
    related_improvements: [IMP-COMP-006]
    status: open
    owner: Mustafa
    created: 2026-05-19
    updated: 2026-08-12

  - id: RISK-006
    title: ODbL-Kompositionspflichten kollidieren mit weiteren Datenquellen
    likelihood: M
    impact: H
    score: 6
    description: |
      Die Open-Food-Facts-Datenbank steht unter ODbL mit Attribution und
      Share-Alike. Das Kombinieren in einer Datenbank mit proprietären oder
      inkompatibel lizenzierten Daten kann Offenlegungspflichten oder eine
      unzulässige Datenbankkomposition erzeugen.
    mitigation: |
      OFF-Rohdaten bleiben in einer technisch erzwungenen ODbL-Partition;
      externe Rohquellen brauchen eigene Speicher. Produced Work, Derivative
      Database und Collective Database sind konservativ klassifiziert.
      G-DATA-LICENSE blockiert Remote-Aktivierung bis Share-Alike-Export,
      Korrektur/Loeschung und qualifiziertes Rechtsreview belegt sind.
    related_decisions: [0030]
    related_gaps: [GAP-003]
    related_improvements: [IMP-COMP-005]
    status: open
    owner: Mustafa
    created: 2026-05-19
    updated: 2026-08-11

  - id: RISK-007
    title: Umwelt-, Nachhaltigkeits- oder Health-Aussage ist irreführend oder unzulässig
    likelihood: M
    impact: H
    score: 6
    description: |
      Score, Ampel, Kaufempfehlung oder Health-Hinweis können von Nutzern als
      stärkere Produkt- oder Gesundheitsaussage verstanden werden, als Daten
      und Methodik tragen. Ab 27. September 2026 verschärft die Umsetzung der
      Richtlinie (EU) 2024/825 den Rahmen für Umweltaussagen zusätzlich.
    mitigation: |
      Versioniertes Claim-Inventar, neutrale Nährwertanzeige ohne Health-Score,
      evidenzgebundene Formulierungen sowie G-CLAIM-SAFETY und
      G-CLAIM-GOVERNANCE sind umgesetzt. Öffentliche Aktivierung bleibt bis
      Kalibrierung, EU-Health-Claims-Prüfung und qualifiziertem Rechts-/Fachreview
      mit Hash-Evidenz blockiert.
    related_gaps: [GAP-002, GAP-013]
    related_improvements: [IMP-COMP-004]
    status: open
    owner: Mustafa
    created: 2026-08-10
    updated: 2026-08-11

  - id: RISK-008
    title: Remote-Writer oder Adminpfad manipuliert Evidenz und Scores
    likelihood: M
    impact: H
    score: 6
    description: |
      Ein öffentlich erreichbarer Serverpfad kann durch fehlerhafte
      Autorisierung, Replay, manipulierte Quellantworten, fehlende Rate Limits
      oder kompromittierte Secrets falsche Evidenz und Scores publizieren.
    mitigation: |
      Versioniertes End-to-End-Threat-Model, serverseitige Vertrauensgrenzen,
      fail-closed EU-Supabase-Umgebungsvertrag und G-BACKEND-BOUNDARY sind
      umgesetzt. Der lokale Writer belegt getrennte Invoker-Secrets, Input-
      und Upstream-Grenzen, Rate-/Tagesbudget, Circuit Breaker, Idempotenz,
      Out-of-order-Schutz und Append-only Audit. Remote-Integration, Secret-
      Rotation, Incident Drill und unabhaengiger Security-Test bleiben offen.
    related_gaps: [GAP-005]
    related_improvements: [IMP-COMP-007, IMP-DEV-002]
    status: open
    owner: Engineering
    created: 2026-08-10
    updated: 2026-08-12

  - id: RISK-009
    title: Provider-Ausfall, Datenalter oder fehlender Betriebsprozess erzeugt falsche Nutzerinformation
    likelihood: M
    impact: H
    score: 6
    description: |
      OFF, Backend oder weitere Quellen können langsam, nicht verfügbar,
      schema-inkompatibel oder veraltet sein. Ohne SLO, Monitoring,
      Stale-Data-Anzeige, Korrektur und Rollback bleibt ein falscher Score
      möglicherweise unentdeckt oder aktiv.
    mitigation: |
      Read-through-Fallback, Stale-Ablehnung, Provider-Failure-Tests und
      Circuit Breaker sind lokal implementiert. G-COST-CONTROL begrenzt den
      Free-Plan- und Add-on-Status sowie 70-Prozent-Warnschwellen. Offen bleiben messbare SLOs,
      Monitoring, Alerts, Score-Sperre, versionierte Korrektur sowie
      Backup-/Restore- und Incident-Drills.
    related_gaps: [GAP-006, GAP-009, GAP-013]
    related_improvements: [IMP-DEV-004, IMP-OPS-001]
    status: open
    owner: Engineering
    created: 2026-08-10
    updated: 2026-08-12

  - id: RISK-010
    title: Apple-, EU-, OWASP- oder Provider-Regeln ändern sich unbemerkt
    likelihood: M
    impact: H
    score: 6
    description: |
      Lebende Plattformregeln und Datenproviderbedingungen können bestehende
      Requirements, Gates, Metadaten oder Lizenzentscheidungen überholen.
    mitigation: |
      Versioniertes Quellenregister, G-GATE-DEFINITION-QUALITY und getrennte
      DPA-, Subprocessor- und Kosten-Gates. Der woechentliche GitHub-Lauf
      prueft offizielle Supabase-Versionsmarker; Aenderungen erzeugen Review
      statt automatischer Freigabe. Andere Quellen folgen dem 30-Tage-Review
      und quartalsweisen Lifecycle-Gap-Audit.
    related_gaps: [GAP-011]
    related_improvements: [IMP-PROC-003]
    status: open
    owner: Release owner
    created: 2026-08-10
    updated: 2026-08-12

  - id: RISK-011
    title: Verlust kritischer Accounts, Zertifikate, Domains oder Recovery-Codes
    likelihood: L
    impact: H
    score: 3
    description: |
      Als Solo-Owner kann der Verlust eines Apple-, GitHub-, Domain-, Backend-
      oder 2FA-Zugangs Entwicklung, Support oder Release dauerhaft blockieren.
    mitigation: |
      Konto- und Rollenregister ohne Secrets, sichere Recovery-Verfahren,
      Ablaufmonitoring, Least Privilege, Break-glass und getesteter
      Rotations-/Recovery-Drill.
    related_gaps: [GAP-010]
    related_improvements: [IMP-OPS-002]
    status: open
    owner: Mustafa
    created: 2026-08-10

  - id: RISK-012
    title: Selection Bias und unkalibrierte Proxies erzeugen systematisch falsche Rankings
    likelihood: M
    impact: H
    score: 6
    description: |
      Kuratierte OFF-Produkte, Kategorieproxies und Länder-/Rohstoffrisiken
      können reale Marktdeckung oder Produktleistung verzerrt darstellen.
      Technisch reproduzierbar bedeutet nicht wissenschaftlich valide.
    mitigation: |
      Vorab festgelegtes Produktkorpus, Coverage-Messung ohne OFF-Search,
      Gold- und Grenzfälle, Sensitivitätsanalyse, Proxy-/Bias-Review und
      unabhängige ESG-/LCA-/Social-Fachprüfung.
    related_gaps: [GAP-001, GAP-007]
    related_improvements: [IMP-DEV-003, IMP-DEV-004]
    status: open
    owner: Mustafa
    created: 2026-08-10

  - id: RISK-013
    title: Writer-Tagesbudget und Cache-TTL begrenzen den Server-Cache auf ~500 frische Produkte
    likelihood: H
    impact: H
    score: 9
    description: |
      Das Tagesbudget von 500 Upstream-Fetches (claim_writer_capacity) und die
      24h-TTL der Edge-Function wurden unabhängig gewählt. Ihr Produkt begrenzt
      die Zahl gleichzeitig frischer Cache-Einträge auf ~500. Bei 10k/100k
      Produkten liegt die Cache-Hit-Rate nahe 0 Prozent und Open Food Facts
      trägt die volle Scan-Last — genau das Rate-Limit-Risiko, das der Cache
      lösen sollte (ADR 0022). Tests publizieren nur ein Produkt und können
      das nicht sichtbar machen.
    mitigation: |
      Budget und TTL gemeinsam dimensionieren und als ADR entscheiden:
      Umgesetzt via ADR 0033: stale_after (24h Frische-Marker) ist von
      expires_at (harte 7-Tage-Grenze) entkoppelt; die Read-RPC serviert
      stale Daten gekennzeichnet, der Client zeigt die Degradation an.
      Demand-driven Ingestion bleibt fuer die Skalierung offen (Telemetrie
      erst nach Privacy-Freigabe). Details siehe Audit 2026-08-13 (F-02).
    related_todos: [TODO-004, TODO-035]
    related_decisions: [0022, 0032, 0033]
    status: mitigated
    updated: 2026-08-13
    owner: Engineering
    created: 2026-08-13

  - id: RISK-014
    title: Score-Berechnung erzeugt Werte aus Nicht-Evidenz und falschen Matches
    likelihood: H
    impact: H
    score: 9
    description: |
      Drei bestätigte Mechanismen widersprechen dem Versprechen "nur belegte
      Signale, keine Schätzung": (a) Ein-Säulen-Produkte erhalten durch
      Gewichts-Renormalisierung fullScore und grüne Ampel bei 1/3
      Datenabdeckung. (b) Social/Governance erhalten 50-Punkte-Neutral-
      Baselines aus bloßer Zutatenliste bzw. Marke, gewichtet mit 30/20
      Prozent. (c) Unverankertes Substring-Matching ("bio" in "antibiotics"
      gibt +20 Bio-Bonus, "palm" in "palmitate" gibt -15) und fehlende
      lc/cc-Parameter (fremdsprachige OFF-Texte) verzerren Einzel-Scores
      systematisch. Verschärft RISK-003, RISK-007 und RISK-012.
    mitigation: |
      Scoring-ADR analog 0027 vor der M5-Kalibrierung: Baselines entfernen
      oder als "nicht bewertet" ausweisen; partialScore-State statt
      fullScore+grün bei Ein-Säulen-Ergebnissen; exaktes praefix-
      normalisiertes Tag-Matching statt Substring; lc=de anfragen; Magic
      Numbers an formulaVersion binden. Details siehe Audit 2026-08-13
      (F-03, F-13).
    related_todos: [TODO-036]
    related_risks: [RISK-003, RISK-007, RISK-012]
    related_decisions: [0011, 0027]
    status: open
    owner: Mustafa
    created: 2026-08-13

  - id: RISK-015
    title: Backend-Betriebsluecken — Retention, Cleanup und Read-Abuse-Schutz
    likelihood: M
    impact: H
    score: 6
    description: |
      Technische Retention und kontrollierte Loeschbarkeit des Append-only
      Writer-Audits sind lokal entschieden und getestet, aber noch nicht remote
      angewandt oder betrieblich ueberwacht. Die barcode-begrenzten Read-RPCs
      verhindern Listenabfragen, haben vor einer Runtime-Aktivierung aber noch
      keinen Edge-basierten Abuse-Schutz.
    mitigation: |
      Indizes, TTL-Cap, private RLS, Trigger-Haertung und direkte Listen-SELECTs
      sind technisch geschlossen. ADR 0035 schuetzt die angewandte
      Migrationshistorie. ADR 0036 und Migration 20260818000100 entziehen der
      Hosted service_role alle direkten App-Tabellen-/Sequenzrechte und lassen
      nur vier gepruefte Writer-RPCs zu; Remote-Diff, Lint und der atomische
      Berechtigungsverifier bestaetigen die wirksame Anwendung.
      ADR 0037, Migration 20260818000200 und 33 Retention-Assertions definieren
      reproduzierbare, begrenzte Sweeps sowie dauerhafte Replay-Watermarks.
      Vor Runtime-Aktivierung folgen Remote-Anwendung, Cleanup-Monitoring und
      Drill sowie ein Read-Rate-Limit mit Negativtests.
      Details: Audits 2026-08-13, 2026-08-17 und 2026-08-18.
    related_todos: [TODO-004, TODO-037]
    related_risks: [RISK-008, RISK-009]
    related_decisions: [0032, 0035, 0036, 0037]
    status: open
    owner: Engineering
    created: 2026-08-13
    updated: 2026-08-18
