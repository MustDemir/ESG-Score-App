# Bewertung:
#   likelihood: L (low) | M (medium) | H (high)
#   impact:     L | M | H
#   score:      grobe Multiplikation (L=1, M=2, H=3) → 1-9
# Status:
#   open       — aktiv, noch nicht entschärft
#   mitigated  — Maßnahme läuft, Restrisiko vertretbar
#   accepted   — Risiko bewusst akzeptiert
#   closed     — nicht mehr relevant

risks:
  - id: RISK-001
    title: Open Food Facts Datenqualität unzureichend für DE-Produkte
    likelihood: M
    impact: H
    score: 6
    description: |
      Wenn 30%+ der DE-Eigenmarken (Rewe, Edeka, Aldi) keine ESG-relevanten
      Felder haben, kippt das MVP-Versprechen.
    mitigation: |
      API-Spike durchgeführt am 2026-05-19 (siehe spikes/off-api-2026-05-19.md):
      - 20/20 kuratierte EANs in OFF gefunden
      - E-Säule 100% berechenbar (Eco-Score 70%, Fallback via Packaging/Agribalyse)
      - S-Säule 95% berechenbar (via labels_tags + origins)
      - WARNUNG: Spike-EANs wurden VIA OFF-SEARCH gefunden — Selection Bias!
        Zufällig gescannte DE-Produkte haben vermutlich schlechtere Coverage.
      - Original-EAN-Liste (Alnatura/GEPA/Hipp/Rewe-Bio) war zu 90% NICHT
        in OFF — das ist das echte Risiko.

      Restmaßnahmen offen:
      - Edge-Case-UX "Keine Daten verfügbar" + Hinweis User-Beitrag
      - Top-100-DE-Produkte selbst manuell pflegen (Hybrid-Strategie)
      - Eco-Score-Fallback: bei "unknown" nicht 0 zeigen sondern transparenter
        Hinweis "Daten unvollständig"
    related_todos: [TODO-001, TODO-011]
    related_gaps: [GAP-007]
    related_decisions: [0003]
    related_spikes: [off-api-2026-05-19.md]
    status: mitigated
    owner: Mustafa
    created: 2026-05-19
    updated: 2026-08-10

  - id: RISK-002
    title: Apple Developer Account Verifizierung verzögert TestFlight
    likelihood: L
    impact: M
    score: 2
    description: |
      Apple-Verifizierung dauert 24-48h, bei Business-Accounts auch 1-2 Wochen.
      Verzögert TestFlight-Launch falls erst spät beantragt.
    mitigation: |
      Account wurde gekauft und verifiziert. Signing, Installation und Start
      auf dem physischen iPhone wurden erfolgreich nachgewiesen. TestFlight
      bleibt bewusst außerhalb des aktuellen Entwicklungsumfangs.
    related_todos: [TODO-003]
    status: closed
    owner: Mustafa
    created: 2026-05-19
    updated: 2026-08-10

  - id: RISK-003
    title: ESG-Score-Formel nicht wissenschaftlich fundiert
    likelihood: M
    impact: H
    score: 6
    description: |
      Eigene ESG-Formel kann als willkürlich oder unseriös wahrgenommen
      werden — Glaubwürdigkeitsproblem, mögliche rechtliche Risiken
      (irreführende Werbung).
    mitigation: |
      Methodik v1.0 bleibt als heuristischer MVP gekennzeichnet. Methodik
      2.0-draft ist nicht score-aktiv; Missing-Data-, Red-Flag-,
      Reproducibility- und Claim-Safety-Gates verhindern Scheingenauigkeit.
      Offen bleiben Referenzkorpus, Normalisierung, Gewichtung,
      Sensitivitätsanalyse und unabhängiges Fachreview.
    related_todos: [TODO-002]
    related_gaps: [GAP-001]
    related_improvements: [IMP-DEV-003]
    status: open
    owner: Mustafa
    created: 2026-05-19
    updated: 2026-08-10

  - id: RISK-004
    title: Solo-Founder-Burnout / Time-to-MVP überschritten
    likelihood: M
    impact: H
    score: 6
    description: |
      Klassisches Solo-Founder-Risiko: Scope-Creep, Perfektionismus,
      Demotivation nach Hype-Phase. Wenn MVP nicht bis Juli steht,
      sinkt die Wahrscheinlichkeit dass es überhaupt fertig wird stark.
    mitigation: |
      Strikte Phase-1-Scope (out_of_scope-Liste in roadmap.yaml).
      Wöchentliches Progress-Tracking (progress.yaml).
      Bei Blockern: Lieber simpler Hack als perfekte Lösung.
    status: open
    owner: Mustafa
    created: 2026-05-19

  - id: RISK-005
    title: DSGVO / Privacy-Setup unvollständig
    likelihood: M
    impact: H
    score: 6
    description: |
      Ohne saubere Privacy Policy, Cookie-Banner-Äquivalent,
      Auftragsverarbeitungsverträge mit Supabase → Abmahnrisiko,
      App-Store-Ablehnung.
    mitigation: |
      Aktueller lokaler MVP verwendet kein Konto, kein Analytics-SDK und kein
      Remote-Supabase-Projekt. RLS, Privacy Manifest und SDK-Audit bestehen.
      Vor Remote-Backend oder externer Beta bleiben Datenfluss,
      Rechtsgrundlagen, AVV, Retention, Betroffenenrechte, Incident und
      DPIA-Entscheidung zu operationalisieren.
    related_todos: [TODO-008]
    related_gaps: [GAP-004]
    related_improvements: [IMP-COMP-006]
    status: open
    owner: Mustafa
    created: 2026-05-19
    updated: 2026-08-10

  - id: RISK-006
    title: ODbL-Kompositionspflichten kollidieren mit weiteren Datenquellen
    likelihood: M
    impact: H
    score: 6
    description: |
      Die Open-Food-Facts-Datenbank steht unter ODbL mit Attribution und
      Share-Alike. Das Kombinieren in einer Datenbank mit proprietären oder
      inkompatibel lizenzierten Daten kann Offenlegungspflichten oder eine
      unzulässige Datenbankkomposition erzeugen.
    mitigation: |
      OFF-Rohdaten bleiben in einer technisch erzwungenen ODbL-Partition;
      externe Rohquellen brauchen eigene Speicher. Produced Work, Derivative
      Database und Collective Database sind konservativ klassifiziert.
      G-DATA-LICENSE blockiert Remote-Aktivierung bis Share-Alike-Export,
      Korrektur/Loeschung und qualifiziertes Rechtsreview belegt sind.
    related_decisions: [0030]
    related_gaps: [GAP-003]
    related_improvements: [IMP-COMP-005]
    status: open
    owner: Mustafa
    created: 2026-05-19
    updated: 2026-08-11

  - id: RISK-007
    title: Umwelt-, Nachhaltigkeits- oder Health-Aussage ist irreführend oder unzulässig
    likelihood: M
    impact: H
    score: 6
    description: |
      Score, Ampel, Kaufempfehlung oder Health-Hinweis können von Nutzern als
      stärkere Produkt- oder Gesundheitsaussage verstanden werden, als Daten
      und Methodik tragen. Ab 27. September 2026 verschärft die Umsetzung der
      Richtlinie (EU) 2024/825 den Rahmen für Umweltaussagen zusätzlich.
    mitigation: |
      Claim-Inventar, evidenzgebundene Formulierungen, technische Claim-Safety,
      EU-Health-Claims-Prüfung und qualifiziertes Rechts-/Fachreview vor
      öffentlicher Aktivierung.
    related_gaps: [GAP-002, GAP-013]
    related_improvements: [IMP-COMP-004]
    status: open
    owner: Mustafa
    created: 2026-08-10

  - id: RISK-008
    title: Remote-Writer oder Adminpfad manipuliert Evidenz und Scores
    likelihood: M
    impact: H
    score: 6
    description: |
      Ein öffentlich erreichbarer Serverpfad kann durch fehlerhafte
      Autorisierung, Replay, manipulierte Quellantworten, fehlende Rate Limits
      oder kompromittierte Secrets falsche Evidenz und Scores publizieren.
    mitigation: |
      End-to-End-Threat-Model vor Implementierung, serverseitige
      Vertrauensgrenzen, Idempotenz, Input Validation, Audit Trail, Rate Limits,
      Secret Rotation und risikobasierter Security-Test.
    related_gaps: [GAP-005]
    related_improvements: [IMP-COMP-007, IMP-DEV-002]
    status: open
    owner: Engineering
    created: 2026-08-10

  - id: RISK-009
    title: Provider-Ausfall, Datenalter oder fehlender Betriebsprozess erzeugt falsche Nutzerinformation
    likelihood: M
    impact: H
    score: 6
    description: |
      OFF, Backend oder weitere Quellen können langsam, nicht verfügbar,
      schema-inkompatibel oder veraltet sein. Ohne SLO, Monitoring,
      Stale-Data-Anzeige, Korrektur und Rollback bleibt ein falscher Score
      möglicherweise unentdeckt oder aktiv.
    mitigation: |
      Reliability-Budgets, Provider-Failure-Tests, Datenfrischeanzeige,
      Monitoring, Alerts, Score-Sperre, versionierte Korrektur sowie
      Backup-/Restore- und Incident-Drills.
    related_gaps: [GAP-006, GAP-009, GAP-013]
    related_improvements: [IMP-DEV-004, IMP-OPS-001]
    status: open
    owner: Engineering
    created: 2026-08-10

  - id: RISK-010
    title: Apple-, EU-, OWASP- oder Provider-Regeln ändern sich unbemerkt
    likelihood: M
    impact: H
    score: 6
    description: |
      Lebende Plattformregeln und Datenproviderbedingungen können bestehende
      Requirements, Gates, Metadaten oder Lizenzentscheidungen überholen.
    mitigation: |
      Versioniertes Quellenregister, 30-Tage-Review bis Release,
      quartalsweiser Lifecycle-Gap-Audit und Release-Blockade bei überfälliger
      anwendbarer Primärquelle.
    related_gaps: [GAP-011]
    related_improvements: [IMP-PROC-003]
    status: open
    owner: Release owner
    created: 2026-08-10

  - id: RISK-011
    title: Verlust kritischer Accounts, Zertifikate, Domains oder Recovery-Codes
    likelihood: L
    impact: H
    score: 3
    description: |
      Als Solo-Owner kann der Verlust eines Apple-, GitHub-, Domain-, Backend-
      oder 2FA-Zugangs Entwicklung, Support oder Release dauerhaft blockieren.
    mitigation: |
      Konto- und Rollenregister ohne Secrets, sichere Recovery-Verfahren,
      Ablaufmonitoring, Least Privilege, Break-glass und getesteter
      Rotations-/Recovery-Drill.
    related_gaps: [GAP-010]
    related_improvements: [IMP-OPS-002]
    status: open
    owner: Mustafa
    created: 2026-08-10

  - id: RISK-012
    title: Selection Bias und unkalibrierte Proxies erzeugen systematisch falsche Rankings
    likelihood: M
    impact: H
    score: 6
    description: |
      Kuratierte OFF-Produkte, Kategorieproxies und Länder-/Rohstoffrisiken
      können reale Marktdeckung oder Produktleistung verzerrt darstellen.
      Technisch reproduzierbar bedeutet nicht wissenschaftlich valide.
    mitigation: |
      Vorab festgelegtes Produktkorpus, Coverage-Messung ohne OFF-Search,
      Gold- und Grenzfälle, Sensitivitätsanalyse, Proxy-/Bias-Review und
      unabhängige ESG-/LCA-/Social-Fachprüfung.
    related_gaps: [GAP-001, GAP-007]
    related_improvements: [IMP-DEV-003, IMP-DEV-004]
    status: open
    owner: Mustafa
    created: 2026-08-10
