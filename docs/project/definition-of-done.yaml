# =============================================================================
# Definition of Done
# =============================================================================
# Verbindliche Checks pro Task-Typ. Ein Task ist NICHT fertig bevor die
# entsprechende Liste komplett abgehakt ist. Gilt für Claude UND für Mustafa.
#
# Wenn ein Check übersprungen wird: das im progress.yaml dokumentieren mit
# Begründung (warum bewusst übersprungen) — sonst gilt der Task als offen.
#
# lade_manifest-Pattern (übernommen aus ai-context-vault, ADR 0009 ACV-3):
# Pro Task-Typ wird deklariert WELCHE Dateien Claude lesen muss (`pflicht`)
# vs. nur als Metadata lesen muss (`kontext`). Spart Tokens und fokussiert
# den Lese-Kontext auf das Relevante.
# =============================================================================

# Allgemeine Regeln, gelten IMMER (egal welcher Task-Typ):
universal_checks:
  - id: U-1
    check: progress.yaml wurde aktualisiert (Milestones / weekly_log / stats)
  - id: U-2
    check: Falls neue Erkenntnis → backlog.yaml, risks.yaml, oder failure-modes.yaml aktualisiert
  - id: U-3
    check: Bei bedeutsamer Entscheidung → ADR im decisions/-Ordner geschrieben
  - id: U-4
    check: Commit-Message folgt Konvention (siehe methodology/conventions.md)
  - id: U-5
    check: Out-of-Scope der aktuellen Phase nicht verletzt
  - id: U-6
    check: Auswirkungen auf Claims, Datenlizenz, Privacy, Security, Accessibility und Betrieb wurden klassifiziert
  - id: U-7
    check: Neue oder verschärfte Lücke wurde in gap-register.yaml und improvement-register.yaml verankert
  - id: U-8
    check: Account, Payment, UGC, Analytics, Standort und AI/ML wurden als Capability-Trigger geprüft

# =============================================================================
# TASK-TYPEN
# =============================================================================
task_types:

  # ---------------------------------------------------------------------------
  - id: feature_code
    title: Neues Feature / Code-Änderung
    description: Jede produktive Code-Änderung in lib/ oder esg_app/
    lade_manifest:
      pflicht:
        - feature_state.yaml des betroffenen Features
        - quality-strategy.md
        - relevante ADRs (siehe decisions/INDEX.md, gefiltert nach Feature-Tag)
        - failure-modes.yaml (mindestens FM-01, FM-02, FM-09, FM-14)
      kontext:
        - roadmap.yaml (Out-of-Scope-Check)
        - backlog.yaml (offene TODOs)
    checks:
      - flutter analyze sauber (kein Warning, kein Error)
      - flutter format --set-exit-if-changed grün
      - flutter test grün (lokal)
      - Unit-Tests für neue Logik geschrieben (Coverage-Gate erfüllt)
      - Bei UI-Code Widget-Test für Hauptpfad
      - try/catch um alle API-Calls + Timeout konfiguriert
      - Edge-Cases bedacht (no-internet, no-data, permission-denied)
      - Keine Secrets im Diff (manuell + gitleaks)
      - Bei neuer Dependency in pubspec.yaml: Lizenz geprüft
      - CI grün auf PR
      - /review (engineering:code-review Skill) ausgeführt
    references:
      - quality-strategy.md
      - failure-modes.yaml [FM-01, FM-02, FM-03, FM-09, FM-14]

  # ---------------------------------------------------------------------------
  - id: api_integration
    title: API-Integration (z.B. OFF, Supabase, LLM-Provider)
    description: Anbindung externer Dienste
    lade_manifest:
      pflicht:
        - decisions/0003-open-food-facts.yaml (für OFF)
        - decisions/0008-security-baseline.yaml (SEC-1, SEC-4)
        - spikes/off-api-2026-05-19.md (für OFF-Spezifika)
      kontext:
        - stack.yaml (Provider-Versionen)
    checks:
      - HTTPS-only, kein Cleartext (SEC-4)
      - API-Key via env-var, nicht hardcoded (SEC-1)
      - Timeout gesetzt (max 8s default)
      - Retry-Logik mit exponential backoff (max 3 Versuche)
      - Rate-Limit beachtet / dokumentiert
      - Response-Parsing in eigenem Mapper, mit Null-Safety
      - Error-States in UI definiert
      - Test mit mock-Response geschrieben
      - Bei Personendaten: DSGVO-Datenfluss dokumentiert
      - Bei gehostetem Provider: provider_governance Task-Typ ebenfalls erfuellt
    references:
      - decisions/0008-security-baseline.yaml [SEC-1, SEC-4]
      - failure-modes.yaml [FM-02, FM-11]

  # ---------------------------------------------------------------------------
  - id: provider_governance
    title: Gehosteten Provider anlegen, ändern oder remote aktivieren
    description: Provider-, Region-, Vertrags-, Unterauftragsverarbeiter- oder Planänderung
    lade_manifest:
      pflicht:
        - compliance/provider-governance-register.yaml
        - compliance/source-register.yaml
        - security/eu-supabase-environment-contract.yaml
        - gate-definitions/gate-definition-schema.yaml
      kontext:
        - compliance/privacy-data-inventory.yaml
        - costs.yaml
        - risks.yaml
    checks:
      - Offizielle Providerquellen besitzen URL, Version, Prüfdatum und nächsten Reviewtermin
      - DPA-Version, Geltungsmechanismus, Verarbeitungsscope und Owner-Entscheidung sind explizit
      - Unterauftragsverarbeiterliste und Status der Änderungsbenachrichtigung sind dokumentiert
      - Region und tatsächlicher Projektstatus sind mit reproduzierbarer Evidenz verifiziert
      - Datentypen und Personendatenfreigabe stimmen mit Privacy-SSOT und Runtime überein
      - Plan, Add-ons, erwartete Fixkosten, Quoten und Warnschwellen sind dokumentiert
      - Pending-Entscheidungen bleiben pending und setzen Remote-Aktivierung fail-closed
      - G-GATE-DEFINITION-QUALITY und alle betroffenen Provider-Gates bestehen
      - Remote-Aktivierung erfolgt nur mit grünem remote_backend-Profil
      - Keine Secrets oder vollständigen Kopien veränderlicher Rechtstexte werden als Evidenz committed
    references:
      - compliance/provider-governance-register.yaml
      - quality-strategy.md
      - decisions/0031-claims-and-privacy-boundaries.yaml
      - decisions/0032-backend-security-boundary.yaml

  # ---------------------------------------------------------------------------
  - id: data_source_integration
    title: Neue ESG-, Produkt-, Risiko- oder Unternehmensdatenquelle
    description: Quelle, Mapping oder neue Datenbeziehung vor Score-Aktivierung
    lade_manifest:
      pflicht:
        - data/source-register.yaml
        - data/data-architecture.md
        - methodology-catalog/scoring-controls.yaml
        - decisions/0022-evidence-first-data-integration.yaml
        - decisions/0025-evidence-backed-traceability-links.yaml
        - gap-register.yaml
      kontext:
        - compliance/source-register.yaml
        - risks.yaml
    checks:
      - Autorität, Originalquelle, Version, Aktualität und Granularität sind dokumentiert
      - Database-, Content- und Bildlizenz sowie Attribution sind getrennt geprüft
      - ODbL- oder andere Kompositionswirkung auf den Zieldatenspeicher ist bewertet
      - Produkt-, Rohstoff-, Herkunfts- oder Rechtsträgerbeziehung besitzt geeignete Evidenz und Confidence
      - Rohfeld, Normalisierung und Retrieval-Channel bleiben nachvollziehbar
      - Unsichere Community-, Hersteller- oder Kategorieangaben sind standardmäßig nicht score-aktiv
      - Missing-Data-, Red-Flag-, Reproducibility- und Claim-Safety-Regeln sind erfüllt
      - Mapper-, Contract-, negative und Schema-Drift-Tests bestehen
      - Datenkorrektur, Rücknahme, Frische und Provider-Ausfall sind beschrieben
      - G-DATA-ARCH, G-METHOD-CATALOG und betroffene Scoring-Safety-Gates bestehen
    references:
      - methodology/gap-analysis-process.md
      - data/data-architecture.md

  # ---------------------------------------------------------------------------
  - id: supabase_change
    title: Supabase-Schema- oder Policy-Änderung
    description: Migration, neue Tabelle, neue RLS-Policy
    lade_manifest:
      pflicht:
        - decisions/0002-supabase-backend.yaml
        - decisions/0008-security-baseline.yaml (SEC-3)
        - failure-modes.yaml FM-12
      kontext:
        - stack.yaml
    checks:
      - Migration-Skript im supabase/migrations/ Ordner
      - ALTER TABLE ... ENABLE ROW LEVEL SECURITY für neue Tabellen
      - RLS-Policies explizit pro Operation (SELECT/INSERT/UPDATE/DELETE)
      - Test: Anon-Role darf NICHT was nicht erlaubt ist
      - supabase db reset --local erfolgreich
      - supabase test db --local erfolgreich
      - supabase db lint --local --level warning ohne Findings
      - Default-Werte und NOT-NULL-Constraints bewusst gewählt
      - Indizes für häufige Queries
      - Rollback-Strategie dokumentiert (kann ich die Migration zurücknehmen?)
    references:
      - decisions/0008-security-baseline.yaml [SEC-3]
      - failure-modes.yaml [FM-12]

  # ---------------------------------------------------------------------------
  - id: methodology_catalog_change
    title: ESG-Parameter- oder Profiländerung
    description: Methodikdefinition, Kategorieprofil oder Quellenmapping
    lade_manifest:
      pflicht:
        - decisions/0011-esg-score-formel.yaml
        - decisions/0022-evidence-first-data-integration.yaml
        - decisions/0023-hierarchical-esg-parameter-catalog.yaml
        - decisions/0025-evidence-backed-traceability-links.yaml
        - methodology-catalog/README.md
        - methodology-catalog/scoring-controls.yaml
      kontext:
        - data/source-register.yaml
    checks:
      - Parameter-ID und Bedeutung bleiben innerhalb einer Version stabil
      - Anwendbarkeit unterscheidet required, conditional und not_applicable
      - Fehlende relevante Daten werden nicht als positives Ergebnis gewertet
      - Länder- oder Rohstoffrisiko wird nicht als Produktverstoß dargestellt
      - Datenkonfidenz bleibt außerhalb der E-/S-/G-Gewichtung
      - Neue Gewichte benötigen Kalibrierung, Review und neue Methodikversion
      - Quelle, Lizenz, Scope, Aktualität und Mapping sind dokumentiert
      - Umwelt-, Nachhaltigkeits-, Nutrition- und Health-Claims sind klassifiziert
      - Referenzkorpus, Sensitivität und Ranking-Regression sind bei Aktivierung geprüft
      - Qualifiziertes Fachreview liegt vor oder Änderung bleibt draft und nicht score-aktiv
      - G-METHOD-CATALOG erfolgreich
      - G-LINK-INTEGRITY erfolgreich
      - G-MISSING-DATA erfolgreich
      - G-RED-FLAG erfolgreich
      - G-SCORE-REPRO erfolgreich
      - G-CLAIM-SAFETY erfolgreich
      - Bei Datenbankänderung G-DATA-RLS erfolgreich
    references:
      - decisions/0023-hierarchical-esg-parameter-catalog.yaml
      - decisions/0025-evidence-backed-traceability-links.yaml
      - methodology-catalog/parameters.yaml
      - methodology-catalog/scoring-controls.yaml

  # ---------------------------------------------------------------------------
  - id: architecture_decision
    title: Architektur-Entscheidung treffen
    description: Tech-Stack, Pattern, Provider-Wahl
    lade_manifest:
      pflicht:
        - methodology/adr-process.md
        - decisions/INDEX.md (verwandte ADRs prüfen)
        - methodology/conventions.md
      kontext:
        - roadmap.yaml
    checks:
      - ADR im decisions/ geschrieben (NNNN-titel.yaml)
      - Mindestens 2 Alternativen verglichen mit pros/cons
      - Rationale klar formuliert
      - Consequences aufgelistet
      - related-ADRs verlinkt
      - Falls ältere ADR betroffen: supersedes-Beziehung gesetzt
      - In progress.yaml unter decisions_made eingetragen
    references:
      - methodology/adr-process.md

  # ---------------------------------------------------------------------------
  - id: release_testflight
    title: TestFlight-Release / App-Store-Submission
    description: Build auf physische Test-Devices oder Store
    lade_manifest:
      pflicht:
        - quality-strategy.md (§5 Release-Gate-Checkliste)
        - decisions/0007-cicd-ct-strategy.yaml
        - decisions/0008-security-baseline.yaml
        - failure-modes.yaml FM-06, FM-07, FM-08, FM-15
      kontext:
        - costs.yaml
        - stack.yaml
    checks:
      - Vollständige Release-Gate-Checklist (quality-strategy.md §5)
      - Coverage >= aktuelles Sprint-Ziel
      - COMPLIANCE_PROFILE=release_candidate ohne offene anwendbare MUST-Findings
      - G-MASVS und risikobasierter Security-Review abgeschlossen
      - Privacy Policy aktuell und versioniert
      - Apple Privacy Manifest gepflegt
      - App Store Privacy Details stimmen mit App, SDKs und Backend überein
      - Accessibility Nutrition Labels durch Common-Task-Evidenz gedeckt
      - Umwelt-, Nachhaltigkeits- und Health-Claim-Review abgeschlossen
      - Datenlizenz-, Attribution- und Supportnachweise geschlossen
      - Changelog geschrieben
      - Version-Bump in pubspec.yaml (SemVer)
      - Git-Tag gesetzt
      - Smoke-Test auf physischem iPhone
      - Signiertes Release-Archive reproduzierbar geprüft
      - Backend-, Provider- und Reviewzugang funktionieren in der Zielumgebung
      - Backup-, Restore-, Incident-, Support- und Datenkorrektur-Drill bestanden
      - Rollback- und Score-Rücknahmeplan versioniert und reviewt
    references:
      - quality-strategy.md
      - failure-modes.yaml [FM-06, FM-07, FM-08, FM-15]

  # ---------------------------------------------------------------------------
  - id: spike
    title: Spike / Recherche / Validierung
    description: Erkenntnisgewinn ohne produktiven Code
    lade_manifest:
      pflicht:
        - relevante RISK aus risks.yaml
        - relevante ADR(s)
      kontext:
        - frühere spikes/*.md
    checks:
      - Spike-Report in docs/project/spikes/ angelegt (Markdown)
      - Methodik dokumentiert (was wurde wie getestet)
      - Ergebnisse mit Zahlen / Belegen
      - Interpretation: GO / NO-GO / GO-mit-Bedingungen
      - Nächste Schritte abgeleitet (neue TODOs in backlog.yaml)
      - Verlinkt mit relevanter RISK oder ADR
      - Spike-Code (falls vorhanden) committet UND als Experiment markiert
        (nicht in produktiven Pfaden gelandet)

  # ---------------------------------------------------------------------------
  - id: documentation
    title: Dokumentation / ADR / YAML-Update
    description: Pure Doku-Änderungen ohne Code
    checks:
      - Markdown / YAML syntaktisch valide (yamllint / lint-runs)
      - Cross-Links funktionieren (relativ-Pfade korrekt)
      - last_updated-Feld aktualisiert
      - Falls Inhalt Entscheidung impliziert: ist auch ADR nötig?

  # ---------------------------------------------------------------------------
  - id: gap_assessment
    title: Lifecycle-Gap- oder Phasenreife-Review
    description: Vollständige oder capability-spezifische Lückenanalyse
    lade_manifest:
      pflicht:
        - methodology/product-engineering-handbook.md
        - methodology/gap-analysis-process.md
        - gap-register.yaml
        - improvement-register.yaml
        - risks.yaml
        - compliance/source-register.yaml
      kontext:
        - progress.yaml
        - roadmap.yaml
        - definition-of-done.yaml
    checks:
      - Zwölf Prüffelder gegen alle betroffenen Lifecycle-Phasen bewertet
      - Negative-Space-, Premortem-, Threat-, Privacy- und NFR-Review durchgeführt
      - Aktuelle Primärquellen mit Version und Prüftag verwendet
      - Jeder P0-/P1-Gap besitzt Owner, Zielprofil, Trigger und Closure-Kriterien
      - Jeder P0-/P1-Gap ist mit Improvement und Risiko verknüpft
      - Auditbericht ist datiert und verändert frühere Befunde nicht still
      - G-PROJECT-CONTROL und Dokumentations-Gates bestehen
    references:
      - methodology/gap-analysis-process.md

  # ---------------------------------------------------------------------------
  - id: operations_readiness
    title: Betriebs-, Support- oder Resilience-Änderung
    description: Monitoring, Alert, Incident, Backup, Restore, Korrektur oder Kontinuität
    lade_manifest:
      pflicht:
        - delivery-operating-model.md
        - improvement-register.yaml
        - gap-register.yaml
        - risks.yaml
      kontext:
        - failure-modes.yaml
        - compliance/dsgvo-relevance.md
    checks:
      - SLO, Messpunkt, Alertschwelle, Owner und Reaktionszeit sind definiert
      - Telemetrie ist datensparsam und mit Privacy-Angaben konsistent
      - Runbook und Eskalationsweg sind versioniert
      - Restore, Rollback oder Recovery wurde real geprobt
      - Fehlerhafte Evidenz oder Score-Version kann gesperrt und korrigiert werden
      - Nutzer-/Herstellermeldung und Audit Trail sind berücksichtigt
      - Post-Drill-Findings sind in Gap-, Risiko- oder Verbesserungsregister erfasst

  # ---------------------------------------------------------------------------
  - id: dependency_update
    title: Dependency Update / Upgrade
    description: pubspec.yaml-Änderung, neue Library oder Version
    checks:
      - Changelog der Library gelesen — Breaking Changes verstanden
      - Lizenz geprüft (kein GPL ohne Bedacht)
      - flutter test grün nach Update
      - flutter analyze sauber nach Update
      - Bundle-Size-Auswirkung beachtet (besonders große Libs)
      - Pubspec-Lock committed
      - Bei Security-Update: in progress.yaml unter weekly_log notiert
    references:
      - decisions/0008-security-baseline.yaml [SEC-5]
      - failure-modes.yaml [FM-04]

  # ---------------------------------------------------------------------------
  - id: bug_fix
    title: Bug-Fix
    description: Korrektur eines fehlerhaften Verhaltens
    lade_manifest:
      pflicht:
        - betroffene Code-Datei + Test-Datei
        - failure-modes.yaml (passender FM falls bekannt)
      kontext:
        - feature_state.yaml des Features
    checks:
      - Bug reproduzierbar gemacht (lokal oder via Test)
      - Test geschrieben der den Bug nachstellt (Regression-Test)
      - Test schlägt VOR Fix fehl, NACH Fix grün
      - Root Cause verstanden — nicht nur Symptom behoben
      - Falls Bug auf größeres Problem deutet: in failure-modes.yaml dokumentieren
      - Bei Security-Bug: in risks.yaml als RISK eintragen + Mitigation
    references:
      - failure-modes.yaml

# =============================================================================
# Eskalations-Regel
# =============================================================================
escalation:
  rule: |
    Wenn ein Check nicht erfüllt werden kann (technisch oder zeitlich), gilt:
    1. NICHT als "fertig" markieren
    2. Im progress.yaml den Grund dokumentieren
    3. Als TODO mit P1 oder P0 in backlog.yaml anlegen
    4. Falls Security/Compliance-Check betroffen: Eskalation an User (Mustafa)
       BEVOR weitergemacht wird

# =============================================================================
# Wartung
# =============================================================================
maintenance:
  cadence: Bei jedem Phasenwechsel und vollständiger Review mindestens quartalsweise
  questions:
    - Sind alle Task-Typen abgedeckt die in der neuen Phase auftauchen?
    - Welche Checks haben sich als zu lasch / zu streng erwiesen?
    - Gibt es neue Skills / Tools die wir hier einbinden sollten?
    - Sind Primärquellen, Capability-Trigger und Gap-Zielprofile noch aktuell?
