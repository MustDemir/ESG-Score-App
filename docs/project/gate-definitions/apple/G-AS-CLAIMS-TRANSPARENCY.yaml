schema_version: "2.0"
schema_profile: scanfair-gate-v2
id: G-AS-CLAIMS-TRANSPARENCY
name: ESG claim truthfulness and methodological transparency
title: Evidence-limited ESG claims and methodological transparency
status: active
dimension: regulatorisch
lifecycle_phase: pre-deployment
source_type: mixed
trigger: [scoring_change, source_data_change, result_copy_change, marketing_change, release_candidate, submission]
automation: HYBRID
profile_scope: [development, release_candidate, submission]
policy_checks: [policy_claims_transparency]
criteria:
  - id: ASCT-001
    statement: A versioned methodology and source-provenance record exists for each displayed score.
    obligation: MUST
    pipeline_effect: block
    applicability: always
    effective_date: 2026-06-08
    verification: AUTO
    evidence_level: repository
    implementation_status: implemented
    severity: BLOCK
    negative_case: {id: ASCT-N01, statement: A score without a methodology document fails.}
  - id: ASCT-002
    statement: Missing data, partial results and limitations remain visible and cannot imply unsupported precision.
    obligation: MUST
    pipeline_effect: block
    applicability: always
    effective_date: 2026-09-27
    verification: AUTO
    evidence_level: mixed
    implementation_status: implemented
    severity: BLOCK
    negative_case: {id: ASCT-N02, statement: A hidden limitation or unsupported aggregate claim fails.}
  - id: ASCT-003
    statement: A qualified legal and subject-matter review substantiates consumer-facing ESG comparisons before release.
    obligation: MUST
    pipeline_effect: manual_review
    applicability: conditional
    effective_date: 2026-09-27
    verification: HYBRID
    evidence_level: manual
    implementation_status: pending_review
    severity: BLOCK
    negative_case: {id: ASCT-N03, statement: A due public comparison without qualified review blocks release.}
evidence_required: [docs/ESG-SCORING-MODELL-v1.md, docs/project/compliance/claim-inventory.yaml, source mapping, retained claims review]
artifacts:
  - {id: ASCT-A01, type: repository_input, path: docs/ESG-SCORING-MODELL-v1.md, required_for: [development, release_candidate, submission]}
  - {id: ASCT-A02, type: repository_input, path: docs/project/compliance/claim-inventory.yaml, required_for: [development, release_candidate, submission]}
  - {id: ASCT-A03, type: generated_evidence, path: .quality/compliance-gate-summary.md, required_for: [development, release_candidate, submission]}
  - {id: ASCT-A04, type: manual_evidence, path: docs/project/compliance/evidence/claims-legal-review.yaml, required_for: [release_candidate, submission]}
decision:
  pass: Objective methodology and limitation checks pass; strict profiles require qualified substantiation evidence for applicable claims.
  fail: Claims exceed evidence, required limitations are hidden or due review evidence is absent.
  manual_review: Legal and subject-matter owners decide substantive truthfulness.
enforcement: {development: block, release_candidate: block, submission: block}
owner: Product methodology owner
audit_trail: {enabled: true, evidence_store_ref: "evidence://apple/G-AS-CLAIMS-TRANSPARENCY"}
audit: {validator: scripts/compliance/validate_compliance_catalog.rb, tests: docs/project/policies/apple/policy_gate_groups_test.rego, local_runner: scripts/quality/run_quality_gates.sh, ci_workflow: .github/workflows/quality-gates.yml, evidence_output: .quality/compliance-gate-summary.md}
waiver: {allowed: false, conditions: [], maximum_days: null}
links: {requirements: [R-AS-27], improvements: [IMP-COMP-004], gaps: [GAP-001, GAP-002], risks: [RISK-003, RISK-007], related_adrs: [0021, 0027, 0031]}
sources: [APPLE-ARG, EU-ECGT-2024-825, DE-UWG-EMP-CO, INTERNAL-SCORING]
notes: Rego verifies declared boundaries; a successful automation run never constitutes legal approval of a sustainability claim.
