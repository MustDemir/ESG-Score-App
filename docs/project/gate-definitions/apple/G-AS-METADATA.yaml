schema_version: "2.0"
schema_profile: scanfair-gate-v2
id: G-AS-METADATA
name: App Store metadata, screenshots and age rating
title: Accurate App Store metadata, screenshots and age rating
status: active
dimension: regulatorisch
lifecycle_phase: pre-deployment
source_type: apple
trigger: [store_listing_change, app_name_change, screenshot_change, release_candidate, submission]
automation: HYBRID
profile_scope: [development, release_candidate, submission]
policy_checks: [policy_metadata]
criteria:
  - id: ASMD-001
    statement: The canonical app name and subtitle remain present, truthful in scope and no longer than Apple limits.
    obligation: MUST
    pipeline_effect: block
    applicability: always
    effective_date: 2026-06-08
    verification: AUTO
    evidence_level: repository
    implementation_status: implemented
    severity: BLOCK
    negative_case: {id: ASMD-N01, statement: A missing or overlong App Store name or subtitle fails.}
  - id: ASMD-002
    statement: Store metadata does not name unsupported competing platforms or make unsupported claims.
    obligation: MUST
    pipeline_effect: block
    applicability: always
    effective_date: 2026-06-08
    verification: AUTO
    evidence_level: repository
    implementation_status: implemented
    severity: BLOCK
    negative_case: {id: ASMD-N02, statement: Forbidden platform terminology in metadata fails.}
  - id: ASMD-003
    statement: Screenshots, age-rating answers and brand-rights evidence are reviewed against the submitted listing.
    obligation: MUST
    pipeline_effect: manual_review
    applicability: conditional
    effective_date: 2026-06-08
    verification: HYBRID
    evidence_level: manual
    implementation_status: pending_review
    severity: BLOCK
    negative_case: {id: ASMD-N03, statement: A submission without reviewed screenshots or rating evidence is blocked.}
evidence_required: [versioned App Store metadata export, screenshots, age-rating export, brand-rights review]
artifacts:
  - {id: ASMD-A01, type: repository_input, path: docs/project/compliance/compliance-manifest.json, required_for: [development, release_candidate, submission]}
  - {id: ASMD-A02, type: repository_input, path: docs/project/compliance/apple-review-relevance.md, required_for: [development, release_candidate, submission]}
  - {id: ASMD-A03, type: generated_evidence, path: .quality/compliance-gate-summary.md, required_for: [development, release_candidate, submission]}
  - {id: ASMD-A04, type: manual_evidence, path: docs/project/compliance/evidence/app-store-metadata-review.yaml, required_for: [release_candidate, submission]}
decision:
  pass: Deterministic metadata checks pass and strict profiles include reviewed listing evidence.
  fail: Metadata is objectively invalid or required human review is absent.
  manual_review: Product and release owner validate listing truthfulness, screenshots, age rating and rights.
enforcement: {development: block, release_candidate: block, submission: block}
owner: Product and release owner
audit_trail: {enabled: true, evidence_store_ref: "evidence://apple/G-AS-METADATA"}
audit: {validator: scripts/compliance/validate_compliance_catalog.rb, tests: docs/project/policies/apple/policy_gate_groups_test.rego, local_runner: scripts/quality/run_quality_gates.sh, ci_workflow: .github/workflows/quality-gates.yml, evidence_output: .quality/compliance-gate-summary.md}
waiver: {allowed: false, conditions: [], maximum_days: null}
links: {requirements: [R-AS-10, R-AS-11, R-AS-12], improvements: [IMP-COMP-004], gaps: [GAP-008], risks: [RISK-007], related_adrs: [0021]}
sources: [APPLE-ARG, APPLE-ASC-METADATA]
notes: Automated checks only cover deterministic metadata facts; image, age-rating and trademark decisions remain human review.
