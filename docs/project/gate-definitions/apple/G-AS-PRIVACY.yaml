schema_version: "2.0"
schema_profile: scanfair-gate-v2
id: G-AS-PRIVACY
name: Privacy, consent and data declarations
title: Privacy notices, consent and data-use declarations
status: active
dimension: regulatorisch
lifecycle_phase: pre-deployment
source_type: mixed
trigger: [privacy_change, sdk_change, permission_change, account_change, tracking_change, release_candidate, submission]
automation: HYBRID
profile_scope: [development, release_candidate, submission]
policy_checks: [policy_privacy]
criteria:
  - id: ASPR-001
    statement: The shipped privacy manifest and data inventory agree with actual app data practices.
    obligation: MUST
    pipeline_effect: block
    applicability: always
    effective_date: 2026-06-08
    verification: AUTO
    evidence_level: mixed
    implementation_status: implemented
    severity: BLOCK
    negative_case: {id: ASPR-N01, statement: A missing inventory or contradictory privacy declaration fails.}
  - id: ASPR-002
    statement: Public privacy-policy and App Store privacy details are complete before release.
    obligation: MUST
    pipeline_effect: manual_review
    applicability: conditional
    effective_date: 2026-06-08
    verification: HYBRID
    evidence_level: manual
    implementation_status: pending_review
    severity: BLOCK
    negative_case: {id: ASPR-N02, statement: A release candidate without public policy evidence is blocked.}
  - id: ASPR-003
    statement: Tracking, accounts, location and third-party AI activate their specific permission, deletion and review controls.
    obligation: MUST
    pipeline_effect: block
    applicability: conditional
    effective_date: 2026-06-08
    verification: AUTO
    evidence_level: repository
    implementation_status: implemented
    severity: BLOCK
    negative_case: {id: ASPR-N03, statement: An enabled high-impact capability without its guard fails.}
evidence_required: [docs/project/compliance/privacy-data-inventory.yaml, docs/privacy.md, App Store Connect privacy export, conditional control evidence]
artifacts:
  - {id: ASPR-A01, type: repository_input, path: docs/project/compliance/privacy-data-inventory.yaml, required_for: [development, release_candidate, submission]}
  - {id: ASPR-A02, type: repository_input, path: docs/project/compliance/compliance-manifest.json, required_for: [development, release_candidate, submission]}
  - {id: ASPR-A03, type: generated_evidence, path: .quality/compliance-gate-summary.md, required_for: [development, release_candidate, submission]}
  - {id: ASPR-A04, type: manual_evidence, path: docs/project/compliance/evidence/privacy-release-review.yaml, required_for: [release_candidate, submission]}
decision:
  pass: Data-flow boundaries and conditional controls pass; strict profiles also require current public declarations.
  fail: Data practices, capability controls or required release evidence are incomplete.
  manual_review: Privacy and release owner review legal content and App Store declarations.
enforcement: {development: block, release_candidate: block, submission: block}
owner: Privacy and release owner
audit_trail: {enabled: true, evidence_store_ref: "evidence://apple/G-AS-PRIVACY"}
audit: {validator: scripts/compliance/validate_compliance_catalog.rb, tests: docs/project/policies/apple/policy_gate_groups_test.rego, local_runner: scripts/quality/run_quality_gates.sh, ci_workflow: .github/workflows/quality-gates.yml, evidence_output: .quality/compliance-gate-summary.md}
waiver: {allowed: false, conditions: [], maximum_days: null}
links: {requirements: [R-AS-01, R-AS-02, R-AS-04, R-AS-05, R-AS-07, R-AS-15, R-AS-28], improvements: [IMP-COMP-003, IMP-COMP-006], gaps: [GAP-004], risks: [RISK-005], related_adrs: [0021, 0031]}
sources: [APPLE-ARG, APPLE-APP-PRIVACY, APPLE-APP-PRIVACY-DETAILS, EU-GDPR]
notes: Feature flags control applicability but must be reconciled to the shipped binary before release.
