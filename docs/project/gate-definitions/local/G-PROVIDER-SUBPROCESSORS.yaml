schema_version: "1.0"
schema_profile: scanfair-gate-v1
id: G-PROVIDER-SUBPROCESSORS
title: Supabase subprocessor inventory and change governance
status: active
dimension: vendor-governance
lifecycle_phase: provider-onboarding-and-operations
automation: HYBRID
owner: Privacy and vendor owner
profile_scope: [development, remote_backend, release_candidate]

trigger:
  - remote_project_creation
  - subprocessor_list_change
  - new_provider_capability
  - quarterly_review
  - release_candidate

criteria:
  - id: SUB-001
    statement: The official subprocessor list version, review date and next review are versioned and current.
    verification: AUTO
    severity: BLOCK
  - id: SUB-002
    statement: Weekly change detection compares the official version marker without automatically approving a change.
    verification: AUTO
    severity: BLOCK
  - id: SUB-003
    statement: The privacy and vendor owner subscribes to changes and approves the relevant processing scope before remote activation.
    verification: HYBRID
    severity: BLOCK

artifacts:
  - id: SUB-A01
    type: repository_input
    path: docs/project/compliance/provider-governance-register.yaml
    required_for: [development, remote_backend, release_candidate]
  - id: SUB-A02
    type: generated_evidence
    path: .quality/provider-governance/G-PROVIDER-SUBPROCESSORS.json
    required_for: [development, remote_backend, release_candidate]
  - id: SUB-A03
    type: manual_evidence
    path: docs/project/compliance/evidence/provider-governance-approval.yaml
    required_for: [remote_backend, release_candidate]

decision:
  pass: Development inventory is current; strict profiles additionally require confirmed notifications and owner approval.
  fail: The list is stale, changed without review, unresolvable or lacks strict-profile approval.
  manual_review: Provider relevance, transfers and objections remain human decisions.

enforcement:
  development: block
  remote_backend: block
  release_candidate: block

audit:
  validator: scripts/quality/validate_provider_governance.rb
  tests: scripts/quality/test_provider_governance_gate.rb
  local_runner: scripts/quality/run_provider_governance_gates.sh
  ci_workflow: .github/workflows/quality-gates.yml
  evidence_output: .quality/provider-governance/G-PROVIDER-SUBPROCESSORS.json
  maximum_periodic_review_days: 92

waiver:
  allowed: false
  conditions: []
  maximum_days: null

links:
  requirements: [R-DSGVO-11]
  improvements: [IMP-COMP-003, IMP-COMP-006, IMP-PROC-003]
  gaps: [GAP-004, GAP-011]
  risks: [RISK-005, RISK-010]
  related_adrs: [0002, 0031, 0032]

sources: [SUPABASE-DPA, SUPABASE-SUBPROCESSORS, EU-GDPR]

notes: |
  A detected source change produces review_required, never automatic legal
  approval. The full provider list is referenced, not copied into the repo.
