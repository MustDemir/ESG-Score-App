schema_version: "1.0"
schema_profile: scanfair-gate-v1
id: G-PROVIDER-DPA
title: Supabase data-processing agreement and region approval
status: active
dimension: privacy
lifecycle_phase: provider-onboarding-and-remote-activation
automation: HYBRID
owner: Privacy and platform owner
profile_scope: [development, remote_backend, release_candidate]

trigger:
  - remote_project_creation
  - dpa_version_change
  - processing_scope_change
  - personal_data_activation
  - release_candidate

criteria:
  - id: DPA-001
    statement: The official DPA URL, version, effective date and review schedule are versioned and current.
    verification: AUTO
    severity: BLOCK
  - id: DPA-002
    statement: The development project region is verified as eu-central-1 and personal data remains prohibited until approval.
    verification: AUTO
    severity: BLOCK
  - id: DPA-003
    statement: A privacy and platform owner reviews processor terms, transfers and the actual ScanFair processing scope before remote activation.
    verification: HYBRID
    severity: BLOCK

artifacts:
  - id: DPA-A01
    type: repository_input
    path: docs/project/compliance/provider-governance-register.yaml
    required_for: [development, remote_backend, release_candidate]
  - id: DPA-A02
    type: repository_input
    path: docs/project/security/eu-supabase-environment-contract.yaml
    required_for: [development, remote_backend, release_candidate]
  - id: DPA-A03
    type: generated_evidence
    path: .quality/provider-governance/G-PROVIDER-DPA.json
    required_for: [development, remote_backend, release_candidate]
  - id: DPA-A04
    type: manual_evidence
    path: docs/project/compliance/evidence/provider-governance-approval.yaml
    required_for: [remote_backend, release_candidate]

decision:
  pass: Development metadata is current and fail-closed; strict profiles additionally require typed owner approval evidence.
  fail: Source, region, scope, freshness or strict-profile approval evidence is missing or contradictory.
  manual_review: Legal interpretation and approval remain with the privacy and platform owner.

enforcement:
  development: block
  remote_backend: block
  release_candidate: block

audit:
  validator: scripts/quality/validate_provider_governance.rb
  tests: scripts/quality/test_provider_governance_gate.rb
  local_runner: scripts/quality/run_provider_governance_gates.sh
  ci_workflow: .github/workflows/quality-gates.yml
  evidence_output: .quality/provider-governance/G-PROVIDER-DPA.json
  maximum_periodic_review_days: 365

waiver:
  allowed: false
  conditions: []
  maximum_days: null

links:
  requirements: [R-DSGVO-11]
  improvements: [IMP-COMP-003, IMP-COMP-006, IMP-DEV-002]
  gaps: [GAP-004, GAP-011]
  risks: [RISK-005, RISK-010]
  related_adrs: [0002, 0031, 0032]

sources: [SUPABASE-DPA, SUPABASE-REGIONS, EU-GDPR]

notes: |
  Development PASS confirms a current, non-personal and remotely disabled
  state. It is not legal advice and does not approve production processing.
