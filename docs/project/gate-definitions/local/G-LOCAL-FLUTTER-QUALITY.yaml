id: G-LOCAL-FLUTTER-QUALITY
name: Flutter quality baseline
dimension: technisch
lifecycle_phase: pre-deployment
trigger: Pull request, push to main/feature branches, local quality run
policy_checks:
  - dart format --set-exit-if-changed lib test
  - flutter analyze --fatal-infos
  - flutter test --coverage
  - line coverage >= 60 percent
evidence_required:
  - .quality/quality-gate-report.md
  - esg_app/coverage/lcov.info
decision: block
owner: Mustafa
audit_trail:
  enabled: true
  evidence_store_ref: artifact://scanfair-quality-gate-results
waiver:
  allowed: false
  requires: null
links:
  requirements:
    - TODO-006
    - TODO-007
  related_adrs:
    - 0007
sources:
  - docs/project/quality-strategy.md
  - docs/project/definition-of-done.yaml
notes: |
  App-local adaptation of the GenAIOps gate pattern. It validates Flutter
  code quality and test execution before any merge. It does not deploy iOS
  and does not publish a release.
