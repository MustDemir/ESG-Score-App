id: G-DATA-LICENSE
name: Data-license composition and source separation
dimension: compliance
lifecycle_phase: data-integration
trigger: Pull request, local quality run, remote-backend activation
policy_checks:
  - Database, content and image rights are classified separately per source
  - Produced Work, Derivative Database and Collective Database scenarios are explicit
  - The generic product cache accepts only the Open Food Facts license partition
  - External raw product sources require dedicated stores
  - OFF attribution and license URIs remain associated with displayed results
  - Persistent image caching remains disabled until separate review
  - Remote backend activation requires repository-backed activation, export, deletion and qualified legal-review evidence
evidence_required:
  - docs/project/data/license-composition-policy.yaml
  - docs/project/decisions/0030-data-license-composition.yaml
  - supabase/migrations/20260811000100_data_license_composition.sql
  - scripts/quality/test_data_license_gate.rb
  - .quality/quality-gate-report.md
decision: block
owner: Mustafa
audit_trail:
  enabled: true
  evidence_store_ref: artifact://scanfair-quality-gate-results
waiver:
  allowed: false
  requires: null
links:
  requirements:
    - GAP-003
    - IMP-COMP-005
  related_adrs:
    - 0022
    - 0030
sources:
  - OFF-LICENSE
  - ODC-ODBL
  - ODC-DBCL
  - CC-BY-SA-3
  - ETALAB-OL-2
notes: |
  Development PASS proves the local separation contract, not legal approval.
  Remote-backend and release-candidate profiles fail closed until qualified
  review and repository-backed activation, share-alike, correction and deletion
  evidence exist. Status labels and arbitrary placeholder files cannot pass;
  evidence manifests must satisfy the typed contract and SHA-256 requirements.
