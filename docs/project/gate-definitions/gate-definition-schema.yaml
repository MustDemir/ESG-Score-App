schema_version: "1.0"
profile: scanfair-gate-v1
owner: Engineering
status: active

scope:
  include:
    - docs/project/gate-definitions/local/*.yaml
    - docs/project/gate-definitions/apple/*.yaml
  exclude:
    - docs/project/gate-definitions/gate-definition-schema.yaml
  compatibility_profiles:
    - legacy_local_v0
    - legacy_apple_v1

canonical_metadata:
  required:
    - schema_version
    - schema_profile
    - id
    - title
    - status
    - dimension
    - lifecycle_phase
    - automation
    - owner
    - profile_scope
    - trigger
    - criteria
    - artifacts
    - decision
    - enforcement
    - audit
    - waiver
    - links
    - sources
    - notes
  allowed_values:
    status: [draft, active, retired]
    automation: [AUTO, HYBRID, MANUAL]
    verification: [AUTO, HYBRID, MANUAL]
    severity: [BLOCK, WARN]
    profiles: [development, remote_backend, release_candidate, submission]
    enforcement: [block, warn, manual_review, not_applicable]
    artifact_type: [repository_input, generated_evidence, manual_evidence]

core_attributes:
  trigger:
    canonical_field: trigger
    legacy_aliases: [trigger]
  criteria:
    canonical_field: criteria
    legacy_aliases: [policy_checks]
  artifacts:
    canonical_field: artifacts
    legacy_aliases: [evidence_required]
  decision:
    canonical_field: decision
    legacy_aliases: [decision]
  owner:
    canonical_field: owner
    legacy_aliases: [owner]
  audit:
    canonical_field: audit
    legacy_aliases: [audit_trail]
  waiver:
    canonical_field: waiver
    legacy_aliases: [waiver]

canonical_rules:
  - Gate ID must match the filename and pattern G-[A-Z0-9-]+.
  - Every criterion has a stable ID, statement, verification type and severity.
  - AUTO gates contain only AUTO criteria.
  - HYBRID gates contain at least one HYBRID or MANUAL criterion.
  - Repository input artifacts exist; generated evidence stays below .quality/.
  - Every source resolves to the source register or an existing repository path.
  - Linked requirements, improvements, gaps, risks and ADRs resolve to the SSOT.
  - A prohibited waiver has no conditions or validity period.
  - Manual approvals cannot be inferred from a successful automated check.
  - Development PASS may validate a fail-closed pending state without approving remote activation.
