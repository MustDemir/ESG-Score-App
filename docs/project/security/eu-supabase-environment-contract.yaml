activation_profiles:
  development:
    remote_backend_must_be_disabled: true
    contract_and_threat_model_must_be_complete: true
    local_implementation_must_be_validated: true
  remote_backend:
    remote_backend_must_be_enabled: true
    development_environment_must_be_active: true
    environment_review_must_be_approved: true
    writer_security_review_must_be_approved: true
    operational_readiness_must_be_approved: true
  release_candidate:
    remote_controls_apply_when_enabled: true
    separate_release_security_review_required: true

reviews:
  environment_activation:
    status: pending_provider_governance_owner_approval_and_remote_deployment
    evidence: null
  writer_security:
    status: pending_independent_review
    evidence: null
  operational_readiness:
    status: pending_remote_cleanup_monitoring_and_drill
    evidence: null
  release_security:
    status: pending_release_candidate
    evidence: null

evidence_contracts:
  environment_activation:
    evidence_type: backend_environment_activation
    required_values:
      decision: approved
      environment: development
      region: eu-central-1
      dpa_status: approved
    required_fields:
      - schema_version
      - reviewed_at
      - reviewer_role
      - environment_contract_sha256
      - threat_model_sha256
      - artifact_path
      - artifact_sha256
    digest_fields: [environment_contract_sha256, threat_model_sha256, artifact_sha256]
  writer_security:
    evidence_type: backend_writer_security_review
    required_values:
      decision: approved
    required_fields:
      - schema_version
      - reviewed_at
      - reviewer_role
      - tested_controls
      - environment_contract_sha256
      - threat_model_sha256
      - artifact_path
      - artifact_sha256
    digest_fields: [environment_contract_sha256, threat_model_sha256, artifact_sha256]
  operational_readiness:
    evidence_type: backend_operational_readiness
    required_values:
      decision: approved
    required_fields:
      - schema_version
      - reviewed_at
      - reviewer_role
      - tested_controls
      - environment_contract_sha256
      - threat_model_sha256
      - artifact_path
      - artifact_sha256
    digest_fields: [environment_contract_sha256, threat_model_sha256, artifact_sha256]
  release_security:
    evidence_type: backend_release_security_review
    required_values:
      decision: approved
      profile: release_candidate
    required_fields:
      - schema_version
      - reviewed_at
      - reviewer_role
      - reviewed_commit_sha
      - tested_controls
      - environment_contract_sha256
      - threat_model_sha256
      - artifact_path
      - artifact_sha256
    field_patterns:
      reviewed_commit_sha: "^[0-9a-f]{40}$"
    digest_fields: [environment_contract_sha256, threat_model_sha256, artifact_sha256]

remote_activation_blocks:
  - remote_schema_migration_drift_or_region_evidence_stale
  - DPA_or_subprocessor_owner_approval_missing
  - subprocessor_change_notification_not_confirmed
  - free_plan_dashboard_evidence_not_reviewed
  - independent_writer_security_review_missing
  - privileged_secret_present_in_client_repository_or_logs
  - remote_environment_writer_and_RLS_integration_tests_missing
  - remote_retention_job_monitoring_and_cleanup_drill_missing
  - secret_rotation_break_glass_or_incident_drill_missing
  - privacy_or_data_license_remote_profile_failing

release_candidate_blocks:
  - release_specific_security_review_missing_or_stale
  - reviewed_commit_does_not_match_release_candidate
  - any_remote_activation_block_when_remote_backend_is_enabled

