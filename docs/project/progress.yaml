      ADR 0016 entscheidet OFF API v3 mit tolerantem Umweltfeld-Mapping.
      OpenFoodFactsService und OpenFoodFactsProductRepository sind als
      Standard-App-Datenquelle verdrahtet. Timeout, Retry, Rate-Limit,
      Not-Found und technische Fehlerzustaende sind implementiert.
      Teststand: 21 Tests PASS, Line-Coverage 82.63 Prozent.

  - id: M12
    title: Nativer iOS-Kamera-Barcode-Scanner und Compile-Gate implementiert
    date: 2026-07-19
    phase: phase-1-mvp
    notes: |
      mobile_scanner 7.3.0 erkennt EAN-8, EAN-13, UPC-A und UPC-E und
      uebergibt den ersten gueltigen Code an den bestehenden OFF-/ESG-Flow.
      Kamera-Permission-, Unsupported- und Fehler-Fallback sind implementiert.
      G-AS-CAMERA-PURPOSE validiert den Info.plist-Zwecktext mit Rego/Conftest.
      Xcode 26.6 baut die unsigned iOS-Simulator-App erfolgreich; GitHub Actions
      zeigt G-IOS-COMPILE als eigenen macOS-Job. Teststand: 25 Tests PASS.

  - id: M13
    title: GitHub-Quality-Gate-Workflow konsolidiert
    date: 2026-07-19
    phase: phase-1-mvp
    notes: |
      ADR 0020 legt quality-gates.yml als einzigen verbindlichen CI/CT-Workflow
      fest. Der redundante ci.yml-Workflow wurde entfernt, ohne Gates zu
      reduzieren. Root-README-Aenderungen starten nun ebenfalls G-DOC-TRACE.
      App-Code, iOS-Signing, Deployment und K8s/Gatekeeper bleiben unveraendert.

  - id: M14
    title: Apple-Compliance-Gates fail-closed und release-orientiert erweitert
    date: 2026-07-19
    phase: phase-1-mvp
    notes: |
      19 Apple-Requirements sind auf acht HYBRID-Entscheidungs-Gates abgebildet.
      Development, Release Candidate und Submission verwenden denselben
      Kontrollkatalog mit gestufter Evidenz-Faelligkeit. Conftest behandelt
      technische Fehler fail-closed, protokolliert Einzelentscheidungen und
      verifiziert die vollstaendige SHA-256-Evidence-Chain. Der lokale
      Development-Lauf besteht 11/11 Gates mit 28 sichtbaren Warnungen;
      das strenge Release-Candidate-Profil blockiert erwartungsgemaess 27 offene
      MUST-Nachweise.

  - id: M15
    title: Evidence-first Datenarchitektur und lokales Supabase-Schema
    date: 2026-07-27
    phase: phase-1-mvp
    notes: |
      ADR 0022 trennt externe Quellfakten, normalisierte ESGEvidence und
      versionierte Score-Snapshots. Der OFF-Mapper speichert Lizenz,
      Originalfeld, Qualitaetsklasse, Schema-Version und Zeitstempel. Eine
      lokale Supabase-Migration definiert Datenquellen, Produktcache, Evidenz,
      Score-Snapshots und private Scans mit RLS. G-DATA-ARCH prueft
      Migration, Client-Rechte, Lizenzmetadaten und Service-Key-Verbot.

  - id: M16
    title: Hierarchischer ESG-Methodikkatalog v2 als gepruefter Entwurf
    date: 2026-07-27
    phase: phase-1-mvp
    notes: |
      ADR 0023 definiert einen universellen Lebensmittelkern mit erbenden
      Pilotprofilen fuer Kaffee, Banane und Kakao/Schokolade. 26 Parameter
      trennen Performance, Kontext-Risiko, Assurance und Datenkonfidenz.
      Formel v1.0 bleibt aktiv; 2.0-draft hat keine Gewichte und ist per RLS
      fuer App-Clients unsichtbar. G-METHOD-CATALOG validiert Definitionen,
      Referenzen, Vererbung und zulässige Kundenaussagen. Der echte
      Der aktuelle Migration-Replay besteht nach der Traceability-Erweiterung
      51/51 pgTAP-Tests ohne DB-Lint-Findings.

  - id: M17
    title: Erste autoritative Umweltquelle und Rohmapping integriert
    date: 2026-07-27
    phase: phase-1-mvp
    notes: |
      ADR 0024 registriert AGRIBALYSE 3.2 unter Etalab Open Licence 2.0.
      Der OFF-Adapter erhaelt AGB-Code, Version, Klimawert und DQR, ordnet die
      Evidenz aber korrekt AGRIBALYSE zu und dokumentiert OFF als
      Retrieval-Channel. E-GHG-INTENSITY ist fuer Kaffee, Banane und
      Kakao/Schokolade als Rohmapping validiert, bleibt jedoch Kategorieproxy
      und bis zu Normalisierung, Kalibrierung und Review nicht score-aktiv.

  - id: M18
    title: Evidenzbasierte Traceability- und Scoring-Safety-Schicht
    date: 2026-07-27
    phase: phase-1-mvp
    notes: |
      ADR 0025 trennt Produkt, Rohstoff, Herkunft, Marke und Rechtstraeger als
      explizite Entitaeten und Beziehungen. OFF-Links tragen Quelle,
      Assertion-Klasse und Confidence, bleiben als Community-Hinweise aber
      nicht score-aktiv. Fuenf neue Gates pruefen Link-Integritaet,
      Missing-Data-Regeln, nicht-kompensierbare Red Flags,
      Score-Reproduzierbarkeit und sichere Kundenaussagen. Der lokale
      Migration-Replay besteht 51/51 pgTAP-Tests ohne DB-Lint-Findings.

  - id: M19
    title: Reproduzierbare Dependency- und Supply-Chain-Baseline
    date: 2026-07-28
    phase: phase-1-mvp
    notes: |
      ADR 0026 kombiniert OSV-Scanner, lokale Lizenzklassifikation,
      iOS-Plugin-Inventar, vollstaendige GitHub-Action-SHAs, Dependabot und
      GitHub Dependency Review. Der lokale Nachweis umfasst 59 Dart-Pakete,
      zwei iOS-Plugins, 16 Action-Referenzen und null bekannte
      Schwachstellen. Ausnahmen sind auf 90 Tage begrenzt.

  - id: M20
    title: Supply-Chain-Baseline remote erzwungen und reviewt
    date: 2026-07-29
    phase: phase-1-mvp
    notes: |
      PR #9 schloss plattformabhaengige SPM-Evidenz sowie zwei automatische
      Security-Review-Findings mit Regressionstests. Pull-Request- und
      Post-Merge-Lauf bestanden alle fuenf GitHub-Jobs. Repository-weites
      Action-SHA-Pinning ist aktiv und G-SUPPLY-CHAIN ist verpflichtender
      main-Statuscheck.

  - id: M21
    title: Scoring-Precedence, Ergebnis-Accessibility und MASVS-Baseline
    date: 2026-08-10
    phase: phase-1-mvp
    notes: |
      ADR 0027 und 39 gezielte Calculator-Faelle schliessen die
      Scoring-Precedence und Entscheidungstestmatrix. Automatisierte
      Kontrast-, Semantik- und Textskalierungschecks haerten den Result-Flow.
      Alle 24 MASVS-2.1-Kontrollen sind risikobasiert klassifiziert;
      G-MASVS besteht im Development-Profil und blockiert offene anwendbare
      MUST-Nachweise im Release-Candidate-Profil. Die lokale Gesamtpipeline
      besteht 21/21 Gates bei 69 Flutter-Tests und 81.11 Prozent Coverage.

  - id: M22
    title: Kaffee-Pilotprodukte und produktgebundene Herkunftskette
    date: 2026-08-10
    phase: phase-1-mvp
    notes: |
      Drei GEPA-Kaffee-GTINs sind als reproduzierbarer Pilot festgelegt und
      live ueber OFF bestaetigt. Eine offizielle GEPA-Produktpublikation wird
      mit URL, SHA-256, Deklarationsklasse und mittlerer Confidence getrennt
      gefuehrt. ADR 0028, Dart-Modell und PostgreSQL erzwingen fuer
      score-faehige Rohstoffherkunft den Kontext der gescannten GTIN. Die
      Herkunftskette ist sichtbar, aktiviert aber noch keinen Risikofaktor
      und kann ohne Environmental-Evidenz keinen Gesamtscore erzeugen.

  - id: M23
    title: Product-Engineering-Handbuch und Lifecycle-Gap-Control operationalisiert
    date: 2026-08-10
    phase: phase-1-mvp
    notes: |
      Zehn Entwicklungsdisziplinen sind in einem repo-nativen Handbuch
      zusammengeführt. ADR 0029 definiert eine wiederholbare Gap-Analyse über
      zwölf Prüffelder, acht Lifecycle-Phasen und Reifegrad 0 bis 5. Der erste
      Audit erfasst vier P0-, acht P1- und zwei P2-/Trigger-Gaps. Das
      Projekt-Control-Gate validiert Gap-IDs, Reifegrad, Zielprofil,
      Improvement-/Risiko-/Quellenlinks, Review-Fälligkeit und Closure-Evidenz.

  - id: M24
    title: Datenlizenz-Komposition lokal durchsetzbar
    date: 2026-08-11
    phase: phase-1-mvp
    notes: |
      ADR 0030, der maschinenlesbare Lizenzvertrag und G-DATA-LICENSE
      klassifizieren Produced Work, Derivative Database und Collective
      Database konservativ. PostgreSQL beschraenkt den Produktcache auf OFF;
      71 pgTAP-Tests beweisen die Quellenbarriere. Remote-Aktivierung bleibt
      bis Rechtsreview, Share-Alike-Export und Korrektur/Loeschung blockiert.

  - id: M25
    title: Claim- und Privacy-Aktivierungsgrenzen lokal durchsetzbar
    date: 2026-08-11
    phase: phase-1-mvp
    notes: |
      ADR 0031, versionierte Claim- und Privacy-Inventare sowie zwei neue Gates
      trennen lokalen Fortschritt von externer Freigabe. Die Nährwertanzeige
      enthält keinen Health-Score oder Fortschrittsbalken. Typed Evidence und
      SHA-256-Bindung verhindern Scheinfreigaben; Release Candidate bleibt bis
      Kalibrierung, Rechts-, Fach-, App-Privacy- und DPIA-Review blockiert.

  - id: M26
    title: Backend-Sicherheitsgrenze definition-of-ready
    date: 2026-08-11
    phase: phase-1-mvp
    notes: |
      ADR 0032, ein STRIDE-/OWASP-API-Threat-Model und der EU-Supabase-
      Umgebungsvertrag trennen read-only Flutter vom vertrauenswuerdigen
      Server-Writer. G-BACKEND-BOUNDARY validiert 25 lokale Gate-Gruppen und
      blockiert Remote-Aktivierung bis zu typisierter, SHA-256-gebundener
      Umgebungs-, Security- und Betriebsevidenz.

  - id: M08
    title: Apple Developer Program gekauft — TODO-003 done
    date: 2026-05-19
    phase: phase-1-mvp
    notes: |
      Apple Developer Program-Mitgliedschaft ($99/Jahr) bezahlt. Verifizierung
      läuft. RISK-002 von M auf L heruntergestuft. TestFlight-Pfad ist
      damit unblocked sobald Verifizierung durch ist.

  - id: M07
    title: Theme-Foundation S11 — scanfair_theme aktiv
    date: 2026-05-19
    phase: phase-1-mvp
    notes: |
      Step S11 abgeschlossen. 4 Theme-Files in esg_app/lib/theme/:
      - scanfair_tokens.dart (Brand-Tokens als Dart-Konstanten)
      - scanfair_colors.dart (Material 3 ColorScheme + Ampel-Mapping)
      - scanfair_typography.dart (Inter + Instrument Serif via google_fonts)
      - scanfair_theme.dart (komplettes ThemeData)
      Plus Smoke-Screen mit Score-Hero-Mock (GEPA 82 → trafficGreen).
      google_fonts ^6.2.1 dependency installiert.
      3 Widget-Tests grün. flutter analyze clean.

  - id: M06
    title: CI/CD-Pipeline + Pre-Commit-Hooks aktiv
    date: 2026-05-19
    phase: phase-1-mvp
    notes: |
      Steps S07 + S08 + S09 abgeschlossen.
      - .github/workflows/ci.yml: flutter analyze + format + test + gitleaks-Job
      - Native Git-Hook (scripts/hooks/pre-commit) installiert
        gitleaks (Secret-Scan) + dart format + Private-Key-Check
        + Merge-Conflict-Check + .env-Schutz
      - Feature-State-Pattern aktiv (docs/project/features/{scanner,scoring,results}/)
      - Feature-State-Template in methodology/

      Hinweis: pre-commit-Framework (Python) wegen Python 3.14 + macOS Tahoe
      pyexpat-Bug nicht nutzbar. Native Bash-Hook stattdessen — gleiche
      Funktionalität.

