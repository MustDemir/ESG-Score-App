      - scanfair_colors.dart (Material 3 ColorScheme + Ampel-Mapping)
      - scanfair_typography.dart (Inter + Instrument Serif via google_fonts)
      - scanfair_theme.dart (komplettes ThemeData)
      Plus Smoke-Screen mit Score-Hero-Mock (GEPA 82 → trafficGreen).
      google_fonts ^6.2.1 dependency installiert.
      3 Widget-Tests grün. flutter analyze clean.

  - id: M06
    title: CI/CD-Pipeline + Pre-Commit-Hooks aktiv
    date: 2026-05-19
    phase: phase-1-mvp
    notes: |
      Steps S07 + S08 + S09 abgeschlossen.
      - .github/workflows/ci.yml: flutter analyze + format + test + gitleaks-Job
      - Native Git-Hook (scripts/hooks/pre-commit) installiert
        gitleaks (Secret-Scan) + dart format + Private-Key-Check
        + Merge-Conflict-Check + .env-Schutz
      - Feature-State-Pattern aktiv (docs/project/features/{scanner,scoring,results}/)
      - Feature-State-Template in methodology/

      Hinweis: pre-commit-Framework (Python) wegen Python 3.14 + macOS Tahoe
      pyexpat-Bug nicht nutzbar. Native Bash-Hook stattdessen — gleiche
      Funktionalität.

