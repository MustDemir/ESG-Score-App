      App-Code, iOS-Signing, Deployment und K8s/Gatekeeper bleiben unveraendert.

  - id: M14
    title: Apple-Compliance-Gates fail-closed und release-orientiert erweitert
    date: 2026-07-19
    phase: phase-1-mvp
    notes: |
      19 Apple-Requirements sind auf acht HYBRID-Entscheidungs-Gates abgebildet.
      Development, Release Candidate und Submission verwenden denselben
      Kontrollkatalog mit gestufter Evidenz-Faelligkeit. Conftest behandelt
      technische Fehler fail-closed, protokolliert Einzelentscheidungen und
      verifiziert die vollstaendige SHA-256-Evidence-Chain. Der lokale
      Development-Lauf besteht 11/11 Gates mit 28 sichtbaren Warnungen;
      das strenge Release-Candidate-Profil blockiert erwartungsgemaess 27 offene
      MUST-Nachweise.

  - id: M15
    title: Evidence-first Datenarchitektur und lokales Supabase-Schema
    date: 2026-07-27
    phase: phase-1-mvp
    notes: |
      ADR 0022 trennt externe Quellfakten, normalisierte ESGEvidence und
      versionierte Score-Snapshots. Der OFF-Mapper speichert Lizenz,
      Originalfeld, Qualitaetsklasse, Schema-Version und Zeitstempel. Eine
      lokale Supabase-Migration definiert Datenquellen, Produktcache, Evidenz,
      Score-Snapshots und private Scans mit RLS. G-DATA-ARCH prueft
      Migration, Client-Rechte, Lizenzmetadaten und Service-Key-Verbot.

  - id: M16
    title: Hierarchischer ESG-Methodikkatalog v2 als gepruefter Entwurf
    date: 2026-07-27
    phase: phase-1-mvp
    notes: |
      ADR 0023 definiert einen universellen Lebensmittelkern mit erbenden
      Pilotprofilen fuer Kaffee, Banane und Kakao/Schokolade. 26 Parameter
      trennen Performance, Kontext-Risiko, Assurance und Datenkonfidenz.
      Formel v1.0 bleibt aktiv; 2.0-draft hat keine Gewichte und ist per RLS
      fuer App-Clients unsichtbar. G-METHOD-CATALOG validiert Definitionen,
      Referenzen, Vererbung und zulässige Kundenaussagen. Der echte
      Der aktuelle Migration-Replay besteht nach der Traceability-Erweiterung
      51/51 pgTAP-Tests ohne DB-Lint-Findings.

  - id: M17
    title: Erste autoritative Umweltquelle und Rohmapping integriert
    date: 2026-07-27
    phase: phase-1-mvp
    notes: |
      ADR 0024 registriert AGRIBALYSE 3.2 unter Etalab Open Licence 2.0.
      Der OFF-Adapter erhaelt AGB-Code, Version, Klimawert und DQR, ordnet die
      Evidenz aber korrekt AGRIBALYSE zu und dokumentiert OFF als
      Retrieval-Channel. E-GHG-INTENSITY ist fuer Kaffee, Banane und
      Kakao/Schokolade als Rohmapping validiert, bleibt jedoch Kategorieproxy
      und bis zu Normalisierung, Kalibrierung und Review nicht score-aktiv.

  - id: M18
    title: Evidenzbasierte Traceability- und Scoring-Safety-Schicht
    date: 2026-07-27
    phase: phase-1-mvp
    notes: |
      ADR 0025 trennt Produkt, Rohstoff, Herkunft, Marke und Rechtstraeger als
      explizite Entitaeten und Beziehungen. OFF-Links tragen Quelle,
      Assertion-Klasse und Confidence, bleiben als Community-Hinweise aber
      nicht score-aktiv. Fuenf neue Gates pruefen Link-Integritaet,
      Missing-Data-Regeln, nicht-kompensierbare Red Flags,
      Score-Reproduzierbarkeit und sichere Kundenaussagen. Der lokale
      Migration-Replay besteht 51/51 pgTAP-Tests ohne DB-Lint-Findings.

  - id: M08
    title: Apple Developer Program gekauft — TODO-003 done
    date: 2026-05-19
