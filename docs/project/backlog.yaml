      - Unteres und oberes Clamping sowie Ampelgrenzen gruen/gelb/rot/grau.
      Der untere Environmental-Clamp ist ueber einen negativen numerischen
      OFF-Score oeffentlich erreichbar und muss ueber Mapper plus Calculator
      getestet werden, ohne private Helfer offenzulegen.
      Dies ist eine Entscheidungstest-Luecke trotz gruenem Coverage-Gate.
    phase: phase-1-mvp
    priority: P1
    effort: S
    status: open
    owner: Engineering
    related: [0010, 0011, TODO-002, TODO-012]
    acceptance_criteria:
      - Alle erreichbaren Entscheidungszweige der Formel v1 besitzen gezielte Tests
      - Ampelgrenzen 40 und 70 sowie dataIncomplete sind explizit getestet
      - Tests dokumentieren ADR-Precedence statt widerspruechliches Verhalten festzuschreiben
      - Coverage sinkt nicht unter den aktuellen Gate-Schwellenwert
    verification:
      - flutter test test/services/esg_score_calculator_test.dart
      - flutter test --coverage
    source: docs/project/audits/2026-07-28-code-quality-accessibility-ci-audit.md
