        die 72-px-Score-Zahl ausreichend. Als kleiner Text auf dem
        alpha:0.12-Pill-Hintergrund liegt der Kontrast aber nur bei ca. 2.81:1.
      - Material-Widgets bringen Semantik mit. Die individuellen ScoreHero-
        und PillarBars-Darstellungen brauchen trotzdem explizite VoiceOver-
        Werte; das Produkt-Emoji soll als dekorativ behandelt werden.
