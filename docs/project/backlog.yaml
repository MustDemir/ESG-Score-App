    title: Scoring-Precedence zwischen ADR 0010 und ADR 0011 entscheiden
    description: |
      ADR 0011 erlaubt im total_score-Beispiel einen S-only-Gesamtscore.
      ADR 0010 und die Implementierung verlangen dagegen eine E-Saeule, bevor
      ein Gesamtwert angezeigt wird. Das konservative Verhalten bleibt.
      ADR 0011 darf nach der Append-only-Regel nicht direkt editiert werden.
      Eine neue ADR muss Precedence, Begruendung und Mindesttestvertrag festlegen.
