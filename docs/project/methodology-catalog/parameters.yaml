schema_version: 1
catalog_id: scanfair-esg-parameters
methodology_version: 2.0-draft
status: draft
updated_at: "2026-07-27"

principles:
  - A parameter result must reference evidence.
  - Missing relevant evidence reduces confidence and is not a positive result.
  - Not applicable parameters do not reduce confidence.
  - Country or commodity risk is not proof of a product-specific violation.
  - Data confidence is reported separately and is not an ESG pillar.

