rollback:
  strategy: Lokale Aenderung isoliert reviewen; Remote bleibt deaktiviert. Bereits angewandte Migrationen nur durch neue Korrekturmigration ergaenzen.
  verification: Migrationshistorie und deaktivierte Runtime pruefen; vor lokalem Reset vorhandene Daten sichern oder isolierte Testinstanz nutzen.
activation_boundary: Lokale Reparatur und PR-/Post-Merge-Nachweis sind abgeschlossen. Keine Remote-Anwendung bis qualifizierter Privacy-Entscheidung und anschliessendem Migrations-Ticket.
