definition_of_ready:
  status: ready
  criteria:
    - id: DOR-01
      criterion: Datenfluss und technische Schutzfunktion sind versioniert.
      status: satisfied
      evidence:
        - docs/project/security/eu-supabase-environment-contract.yaml
        - docs/project/decisions/0040-public-read-abuse-protection.yaml
    - id: DOR-02
      criterion: Remote-Runtime bleibt bis zur Entscheidung deaktiviert.
      status: satisfied
      evidence:
        - docs/project/security/eu-supabase-environment-contract.yaml
    - id: DOR-03
      criterion: Entscheidungs- und Engineering-Owner sind benannt.
      status: satisfied
      evidence:
        - docs/project/tickets/tkt-037-01-privacy-pruefung-ip-pseudonyme.yaml
    - id: DOR-04
      criterion: TKT-037-05 ist done; echte HTTP-Wirksamkeit sowie Ablauf- und Loeschverhalten sind belegt.
      status: satisfied
      evidence:
        - docs/project/tickets/tkt-037-05-postgrest-rate-limit-integration.yaml
        - docs/project/audits/2026-09-23-backend-abschlussreview.md
        - https://github.com/MustDemir/ESG-Score-App/actions/runs/35838485511
acceptance_criteria:
  - id: AC-01
    criterion: |
      Erhobene, transient verarbeitete und gespeicherte Daten sowie Empfaenger,
      Zugriff und Loeschfristen sind widerspruchsfrei dokumentiert.
    status: satisfied
    evidence:
      - docs/project/compliance/privacy-data-inventory.yaml
      - docs/project/compliance/privacy-data-flow.md
      - docs/project/audits/2026-09-24-privacy-review-package.md
    verification:
      - Privacy-Inventar gegen Migration und Umgebungsvertrag abgleichen
    evidence_required:
      - Aktualisiertes Privacy-Dateninventar mit exakten technischen Feldern
  - id: AC-02
    not_applicable_allowed: false
    criterion: |
      Ein qualifizierter Reviewer bewertet Rechtsgrundlage, Erforderlichkeit,
      Verhaeltnismaessigkeit, Informationspflicht und DPIA-Schwelle.
    status: pending
    verification:
      - Review mit Identitaet, Qualifikation, Datum, Scope und Entscheidung pruefen
    evidence_required:
      - Signatur- oder Hash-gebundener Privacy-Review
  - id: AC-03
    criterion: |
      Raw-IP-Speicherung bleibt verboten. Pseudonym, Minutenfenster und Zaehler
      sowie eine Stunde Ablaufzeit sind dokumentiert; tatsaechliche Loeschfrist,
      Cron-Verzoegerung und Batch-/Ausfallrisiko sind getrennt bewertet.
    status: satisfied
    evidence:
      - docs/project/compliance/privacy-data-inventory.yaml
      - supabase/tests/database/public_read_abuse_protection.test.sql
      - docs/project/audits/2026-09-23-public-read-http-validation.md
      - docs/project/audits/2026-09-24-privacy-review-package.md
    verification:
      - Migration, pgTAP und Dateninventar gemeinsam pruefen
    evidence_required:
      - 53/53 pgTAP-Nachweis, reale HTTP-Tests und Privacy-Mapping aus TKT-037-05
  - id: AC-04
    criterion: |
      Bei fehlender oder negativer Freigabe bleibt die Remote-Aktivierung
      technisch und dokumentarisch blockiert.
    status: satisfied
    evidence:
      - scripts/quality/validate_claims_privacy_boundaries.rb
      - scripts/quality/test_claims_privacy_gate.rb
      - docs/project/audits/2026-09-24-privacy-review-package.md
    verification:
      - G-PRIVACY-BOUNDARY und G-BACKEND-BOUNDARY in passendem Profil ausfuehren
    evidence_required:
      - Gate-Berichte mit fail-closed Entscheidung
definition_of_done:
