  status: not_ready
  criteria:
    - id: DOR-01
      criterion: TKT-037-02 ist done und Migrationen 14 und 15 sind remote sichtbar.
      status: pending
      evidence: []
    - id: DOR-02
      criterion: Der Verifier ist lokal und rollback-only gegen den Zielvertrag validiert.
      status: satisfied
      evidence:
        - scripts/quality/verify_public_read_abuse_protection.sql
        - docs/project/audits/2026-09-23-public-read-http-validation.md
    - id: DOR-03
      criterion: Es werden ausschließlich synthetische Testidentitaeten verwendet.
      status: satisfied
      evidence:
        - scripts/quality/verify_public_read_abuse_protection.sql
    - id: DOR-04
      criterion: Runtime bleibt waehrend der Verifikation deaktiviert.
      status: satisfied
      evidence:
        - docs/project/security/eu-supabase-environment-contract.yaml
acceptance_criteria:
  - id: AC-01
    criterion: Authenticator-Hook, private Tabelle, Rechte und Cleanup-Cron entsprechen exakt dem Vertrag.
    status: pending
    verification:
      - Linked-Verifier gegen scanfair-dev ausfuehren
    evidence_required:
      - Erfolgreiches, zeitgestempeltes Verifier-Protokoll
  - id: AC-02
    criterion: 30 Requests werden akzeptiert und der 31. Request wird mit dem erwarteten 429-Vertrag abgewiesen.
    status: pending
    verification:
      - Atomaren Zaehler- und Fehlerpfad im Linked-Verifier pruefen
    evidence_required:
      - Verifier-Nachweis des Grenzwertverhaltens
  - id: AC-03
    criterion: GET sowie fehlende oder ungueltige Client-Identitaet werden fail-closed abgewiesen.
    status: pending
    verification:
      - Negative Verifier-Faelle ausfuehren
    evidence_required:
      - Fehlercode- und Payload-Nachweis
  - id: AC-04
    criterion: Nach Rollback verbleiben keine Verifier-Zeilen oder sonstigen Fixtures.
    status: pending
    verification:
      - Persistenzzaehlung nach Verifier-Lauf ausfuehren
    evidence_required:
      - Null-Fixture-Nachweis
  - id: AC-05
    criterion: Hosted-Gateway-Kette liefert eine vertrauenswuerdige Client-Zuordnung; gefaelschte Header umgehen die Quote nicht und verschiedene Clients werden nicht ungeprueft zusammengefasst.
    status: pending
    verification:
      - Provider-Konfiguration und genehmigten begrenzten HTTP-Test nach Privacy-Freigabe separat pruefen
      - Lokale Tests nicht als Hosted-Nachweis uebernehmen
    evidence_required:
      - Gepruefte Gateway-Konfiguration mit versionsbezogenem HTTP-Nachweis und verantwortlichem Reviewer
