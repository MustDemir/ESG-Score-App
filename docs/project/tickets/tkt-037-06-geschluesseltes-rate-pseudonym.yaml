schema_version: scanfair-ticket-v1
id: TKT-037-06
title: Geschluesseltes, stuendlich rotierendes IP-Pseudonym fuer den Public-Read-Limiter
summary: |
  Das unkeyed SHA-256-Pseudonym ist fuer IPv4 praktisch umkehrbar. Ein HMAC mit
  stuendlich rotierendem, zufaelligem Schluessel begrenzt Verknuepfbarkeit auf
  eine Stunde und macht Zaehlerzeilen nach Schluessel-Loeschung nicht mehr
  einer IP zuordenbar. Grundlage fuer die qualifizierte Privacy-Entscheidung.
parent_todo: TODO-037
ticket_type: supabase_change
dod_task_types: [supabase_change, provider_governance]
priority: P1
status: in_progress
owner: Engineering
decision_owner: Mustafa Demir
created: 2026-09-24
updated: 2026-09-24
scope:
  in:
    - ADR-0040-Ergaenzung zu Schluesselerzeugung, Rotation und Loeschung
    - Forward-only-Migration 16 mit privater Schluesseltabelle und HMAC-Ableitung
    - Schluessel-Loeschung im Hook und im bestehenden Fuenf-Minuten-Cleanup
    - pgTAP-Tests fuer Ableitung, Rotation, Loeschung und Rechte; HTTP-Regression
    - Umgebungsvertrag, PRV-008, Datenfluss und Review-Paket nachziehen
  out:
    - Keine Remote-Anwendung oder App-Aktivierung
    - Keine Veraenderung bereits vorhandener Migrationen 14 und 15
    - Kein Reset der bestehenden lokalen Datenbank scanfair-local
    - Keine Rechtsbewertung; diese bleibt in TKT-037-01
dependencies:
