acceptance_criteria:
  - id: AC-01
    criterion: |
      Das gespeicherte Pseudonym ist ein HMAC-SHA-256 mit einem zufaelligen
      32-Byte-Schluessel je UTC-Stunde; das unkeyed v1-Verfahren wird nicht mehr verwendet.
    status: satisfied
    evidence:
      - supabase/migrations/20260924000100_public_read_keyed_pseudonym.sql
      - supabase/tests/database/public_read_keyed_pseudonym.test.sql
      - docs/project/audits/2026-09-24-keyed-rate-pseudonym-validation.md
    verification: [pgTAP vergleicht gespeicherten Wert mit HMAC und v1-Digest]
    evidence_required: [pgTAP-Nachweis in isolierter Instanz]
  - id: AC-02
    criterion: |
      Schluessel vergangener Stunden werden beim ersten Request der neuen Stunde
      oder spaetestens im naechsten Cleanup-Lauf geloescht; dieselbe IP erhaelt
      in verschiedenen Stunden unterschiedliche Pseudonyme.
    status: satisfied
    evidence:
      - supabase/tests/database/public_read_keyed_pseudonym.test.sql
      - docs/project/audits/2026-09-24-keyed-rate-pseudonym-validation.md
    verification: [pgTAP mit festen Zeitpunkten fuer Rotation und Loeschung]
    evidence_required: [pgTAP-Nachweis fuer Rotation, Unverknuepfbarkeit und Loeschung]
  - id: AC-03
    criterion: |
      Schluesseltabelle und Ableitungsfunktion sind fuer public, anon,
      authenticated und service_role gesperrt; das 30-pro-Minute-Verhalten ueber
      HTTP bleibt unveraendert.
    status: satisfied
    evidence:
      - supabase/tests/database/public_read_keyed_pseudonym.test.sql
      - scripts/quality/test_public_read_http.mjs
      - scripts/quality/verify_public_read_abuse_protection.sql
      - docs/project/audits/2026-09-24-keyed-rate-pseudonym-validation.md
    verification: [Rollen-Negativtests und vollstaendige HTTP-Suite]
    evidence_required: [pgTAP- und HTTP-Protokoll]
  - id: AC-04
    criterion: Vertrag, Inventar, Datenfluss, ADR und Review-Paket beschreiben das neue Verfahren widerspruchsfrei.
    status: satisfied
    evidence:
      - docs/project/decisions/0040-public-read-abuse-protection.yaml
      - docs/project/security/eu-supabase-environment-contract.yaml
      - docs/project/compliance/privacy-data-inventory.yaml
      - docs/project/compliance/privacy-data-flow.md
      - docs/project/compliance/review/tkt-037-01/README.md
    verification: [G-BACKEND-BOUNDARY und G-PRIVACY-BOUNDARY im Development-Profil]
    evidence_required: [Aktualisierte Vertrags- und Inventarartefakte]
