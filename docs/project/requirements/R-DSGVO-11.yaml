id: R-DSGVO-11
title: Auftragsverarbeitungsbedingungen und Unterauftragsverarbeiter kontrollieren
kontrollmechanismus: Hybrid (CI prueft Version, Region, Scope und Evidenzstatus; ein Owner bewertet DPA und Unterauftragsverarbeiter)

lifecycle_phase: pre-deployment
governance_dimension: regulatorisch
must_should: MUST

dsgvo_refs:
  - "Art. 28"
  - "Art. 29"

apple_guideline_refs: []

overlapping_with: []

description: |
  Jeder Dienstleister der personenbezogene Daten in unserem Auftrag verarbeitet,
  braucht einen Auftragsverarbeitungsvertrag (AVV / DPA - Data Processing
  Agreement) nach Art. 28 DSGVO.

  Für ScanFair MVP:
  - Supabase (Backend) → aktuelle Auftragsverarbeitungsbedingungen muessen
    zum tatsaechlichen Scope passen und vor Remote-Aktivierung geprueft sein
  - Open Food Facts → KEINE AVV nötig (wir senden keine personenbezogenen
    Daten an OFF; OFF ist Produkt-Datenbank)
  - Apple TestFlight → kein separater AVV (Apple Developer License regelt das)

  Phase 2+ Add-Ons:
  - Mistral / Claude / Aleph Alpha (KI-Provider) → AVV PFLICHT bei Prompts
    mit User-Daten
  - Sentry / Bugsnag (Crash-Reporting) → AVV PFLICHT
  - RevenueCat (Subscription) → AVV PFLICHT
  - Domain-Provider → meist kein AVV (kein PII-Verarbeiter)

evidence_expected:
  - Versionierter Provider-Governance-Record mit DPA-Version und Entscheidung
  - Verifizierter Projektstandort eu-central-1 und Datenklassifikation
  - Aktuelle Unterauftragsverarbeiterliste mit Aenderungsprozess
  - TOM- und Umgebungsvertrag fuer den aktivierten Scope

acceptance_criteria:
  - Aktuelle Supabase-DPA-Version ist vor Remote-Aktivierung dokumentiert und durch den Owner freigegeben
  - Frankfurt ist als primaere Region verifiziert; internationale Transfers und SCCs werden dadurch nicht pauschal ausgeschlossen
  - Unterauftragsverarbeiterliste, Aenderungsbenachrichtigung und Review-Fristen sind aktuell
  - Neue Provider, SDKs, Datenarten, Regionen oder Verarbeitungsvorgaenge reaktivieren den Review
  - Personenbezogene Daten bleiben bis zur qualifizierten Privacy-Freigabe verboten

linked_gates:
  - G-PROVIDER-DPA
  - G-PROVIDER-SUBPROCESSORS

deployer_implication: |
  - Provider-Governance-Register vor Remote-Aktivierung freigeben
  - DPA- und Unterauftragsverarbeiter-Aenderungen abonnieren und bewerten
  - Bei jedem neuen SDK/Service: AVV-Pflicht prüfen
  - Bei AVV-Klausel-Konflikten: juristischer Review

audit_trigger: "Vor Remote-Aktivierung und Release sowie bei DPA-, Unterauftragsverarbeiter-, Region-, Daten- oder Provider-Aenderungen"

sources:
  - EU-GDPR
  - SUPABASE-DPA
  - SUPABASE-SUBPROCESSORS

phase: phase-1-mvp

related_todos: []
related_failure_modes: []
related_decisions: [0002]

notes: |
  Das aktuelle Supabase-DPA wird laut Anbieter in die Nutzungsbedingungen
  einbezogen. Diese technische Dokumentation ersetzt keine Rechtsberatung und
  keine inhaltliche Owner-Freigabe fuer den konkreten Verarbeitungsscope.

  WARNUNG fuer Phase 2: Jeder neue KI-, Analytics-, Crash- oder Payment-
  Provider erfordert eine eigene Rollen-, Transfer-, DPA- und Subprocessor-
  Bewertung. Ein EU-Standort allein macht diese Pruefung nicht entbehrlich.
