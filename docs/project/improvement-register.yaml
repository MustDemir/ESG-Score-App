  - id: IMP-DEV-003
    layer: development
    title: Wissenschaftliche Score-Kalibrierung und unabhängiges Fachreview
    status: planned
    priority: P0
    risk: H
    owner: Mustafa Demir
    target_profile: release_candidate
    rationale: |
      Safety Controls verhindern offensichtliche Fehlberechnung, beweisen aber
      weder inhaltliche Validität noch belastbare Gewichtung oder faire
      Produktergebnisse.
    acceptance_criteria:
      - Gold-, Grenz-, Missing-Data- und Red-Flag-Korpus ist versioniert
      - Normalisierung, Gewichte, Confidence und Unsicherheit sind begründet
      - Sensitivitäts-, Stabilitäts- und Ranking-Regressionstests bestehen
      - ESG-, LCA- und Social-/Human-Rights-Fachreview ist dokumentiert
      - Methodikaktivierung erfolgt nur über neue Version, ADR und Claim-Review
    evidence:
      - docs/project/methodology-catalog/README.md
      - docs/project/methodology-catalog/scoring-controls.yaml
      - docs/project/audits/2026-08-10-product-engineering-gap-analysis.md
    verification:
      - Externer Review und reproduzierbarer Kalibrierungsreport liegen vor
      - G-METHOD-CATALOG und alle Scoring-Safety-Gates bestehen mit publizierter Version
    dependencies:
      - IMP-DEV-001
      - IMP-COMP-004
    next_action: Referenzkorpus, Reviewrollen und Kalibrierungsprotokoll definieren

  - id: IMP-DEV-004
    layer: development
    title: Beta-Readiness für Performance, Reliability und repräsentative Feldtests
    status: planned
    priority: P1
    risk: H
    owner: Engineering
    target_profile: release_candidate
    rationale: |
      Funktionale Tests allein zeigen nicht, ob ScanFair bei realen Barcodes,
      langsamen Netzen, langen externen Texten, Datenalterung und
      Provider-Ausfällen schnell, verständlich und zuverlässig bleibt.
    acceptance_criteria:
      - Start-, Scan-to-Result-, API- und Datenfrische-SLOs sind definiert
      - Offline-, Slow-Network-, Rate-Limit-, Schema-Drift- und Provider-Ausfalltests bestehen
      - Repräsentatives, vorab festgelegtes Barcode-Korpus reduziert Selection Bias
      - Nutzertest misst Aufgabenabschluss, Verständnis, Vertrauen und Fehlinterpretation
      - Dynamische Daten und Cache-Status sind lokalisiert und VoiceOver-sicher
    evidence:
      - docs/project/audits/2026-08-10-product-engineering-gap-analysis.md
      - docs/project/spikes/off-api-2026-05-19.md
      - docs/project/accessibility/voiceover-language-policy.md
    verification:
      - Performance-/Reliability-Report und Feldtestbericht sind reviewt
      - Release-Candidate-Smoke-Matrix besteht auf unterstützten iPhone-/iOS-Kombinationen
    dependencies:
      - IMP-DEV-002
      - IMP-DEV-003
    next_action: Messgrößen, Geräte-/Netzmatrix und repräsentatives Barcode-Korpus festlegen

  - id: IMP-OPS-001
    layer: operations
    title: Betriebs- und Release-Readiness vor TestFlight
    status: planned
    priority: P1
    risk: H
    owner: Mustafa Demir
    target_profile: submission
    rationale: |
      Ein technisch fertiger Build reicht ohne Restore-, Monitoring-,
      Incident-, Support- und Rollbacknachweise nicht fuer einen kontrollierten
      externen Test oder App-Store-Release.
    acceptance_criteria:
      - Development, Staging und Production sind getrennt
      - Backup, Restore, Migration und Rollback sind getestet
      - Datenschutzfreundliches Crash-, API- und Datenfrische-Monitoring existiert
      - Incident-, Support- und Datenkorrekturprozess sind dokumentiert
      - Fehlerhafte Quellen oder Scores können gesperrt, korrigiert und versioniert neu berechnet werden
      - Nutzer und Hersteller besitzen einen nachvollziehbaren Melde- und Einspruchsweg
      - TestFlight- und Submission-Checklisten besitzen nachvollziehbare Evidenz
    evidence: []
    verification:
      - Submission-Profil und operativer Release-Drill bestehen
    dependencies:
      - IMP-COMP-003
      - IMP-DEV-002
      - IMP-DEV-004
    next_action: Erst nach stabilem Release Candidate einen Betriebs-Readiness-Schnitt planen

  - id: IMP-OPS-002
    layer: operations
    title: Business Continuity für Accounts, Zertifikate, Domains und Secrets
    status: planned
    priority: P1
    risk: H
    owner: Mustafa Demir
    target_profile: submission
    rationale: |
      Das Produkt darf nicht durch Verlust eines einzelnen Apple-, GitHub-,
      Domain-, Backend- oder 2FA-Zugangs dauerhaft unwartbar werden.
    acceptance_criteria:
      - Kritische Accounts, Rollen, Recovery-Wege und Ablaufdaten sind inventarisiert
      - 2FA-, Zertifikats-, Domain- und Secret-Recovery ist sicher hinterlegt
      - Rotation und mindestens ein Recovery-Drill sind protokolliert
      - Least Privilege, Break-glass und Owner-Nachfolge sind dokumentiert
    evidence:
      - docs/project/failure-modes.yaml
      - docs/project/audits/2026-08-10-product-engineering-gap-analysis.md
    verification:
      - Business-Continuity-Checkliste und Recovery-Drill bestehen vor Submission
    dependencies:
      - IMP-PROC-003
    next_action: Kritische Konto- und Credential-Kategorien ohne geheime Werte inventarisieren
