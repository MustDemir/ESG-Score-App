schema_version: "1.0"
last_updated: 2026-08-10
owner: Mustafa Demir
purpose: |
  Zentrales Register der aus der Gesamtbewertung abgeleiteten Verbesserungen.
  Es verbindet Prozess, Compliance, Entwicklung und Betrieb mit pruefbaren
  Akzeptanzkriterien, Evidenz und einer eindeutigen Umsetzungsreihenfolge.

allowed_values:
  layers:
    - process
    - compliance
    - development
    - operations
  statuses:
    - planned
    - in_progress
    - draft
    - review
    - done
    - parked
    - dropped
  priorities:
    - P0
    - P1
    - P2
    - P3
  risks:
    - L
    - M
    - H
  target_profiles:
    - development
    - release_candidate
    - submission

execution_order:
  - IMP-COMP-003
  - IMP-DEV-001
  - IMP-DEV-002
  - IMP-OPS-001

improvements:
  - id: IMP-PROC-001
    layer: process
    title: Verbindliches Delivery Operating Model und geschuetzter main-Branch
    status: done
    priority: P0
    risk: H
    owner: Mustafa Demir
    target_profile: development
    rationale: |
      Aenderungen muessen risikobasiert, nachvollziehbar und nur nach
      reproduzierbaren Quality Gates integriert werden.
    acceptance_criteria:
      - Operating Model mit vier Ebenen, DoR, DoD und Gate-Aufnahmeregel ist versioniert
      - Pull Requests erfassen Risiko, Evidenz, offene Punkte und Rollback
      - main verlangt Pull Request und alle vier GitHub-Statuschecks
      - Force-Push, Branch-Loeschung und Owner-Bypass sind ausgeschlossen
    evidence:
      - docs/project/delivery-operating-model.md
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/workflows/quality-gates.yml
      - https://github.com/MustDemir/ESG-Score-App/rules/19894816
      - https://github.com/MustDemir/ESG-Score-App/pull/7
    verification:
      - GitHub Ruleset Protect main ist active
      - Post-Merge Quality-Gate-Run 30357533047 ist erfolgreich
    dependencies: []
    next_action: Keine; Regeln bei geaenderten GitHub-Jobnamen mitpflegen

  - id: IMP-PROC-002
    layer: process
    title: Verbesserungsregister und Projektstatus als pruefbare SSOT
    status: done
    priority: P0
    risk: M
    owner: Mustafa Demir
    target_profile: development
    rationale: |
      Bewertungsergebnisse waren ueber README, Feature-States, Roadmap und
      Operating Model verteilt und konnten dadurch widerspruechlich werden.
    acceptance_criteria:
      - Alle priorisierten Verbesserungsvorschlaege haben ID, Owner und Status
      - Akzeptanzkriterien, Evidenz, Abhaengigkeiten und naechste Aktion sind erfasst
      - Feature-Uebersicht entspricht den jeweiligen state.yaml-Dateien
      - Ein lokales und in GitHub ausgefuehrtes Gate blockiert Strukturdrift
    evidence:
      - docs/project/improvement-register.yaml
      - docs/project/features/README.md
      - scripts/quality/validate_project_control.rb
      - docs/project/gate-definitions/local/G-LOCAL-PROJECT-CONTROL.yaml
      - https://github.com/MustDemir/ESG-Score-App/pull/8
    verification:
      - G-PROJECT-CONTROL lokal erfolgreich
      - Gesamte lokale Quality-Gate-Pipeline erfolgreich
      - Post-Merge Quality-Gate-Run 30372528843 erfolgreich
    dependencies:
      - IMP-PROC-001
    next_action: Keine; Register und Validator bei neuen Statusfeldern gemeinsam pflegen

  - id: IMP-COMP-001
    layer: compliance
    title: Reproduzierbarer Dependency- und Supply-Chain-Scan
    status: done
    priority: P0
    risk: H
    owner: Engineering
    target_profile: development
    rationale: |
      Flutter-, CocoaPods- und GitHub-Action-Abhaengigkeiten muessen auf
      bekannte Schwachstellen, unerwartete Updates und Lizenzrisiken geprueft
      werden.
    acceptance_criteria:
      - Flutter- und native iOS-Abhaengigkeiten sind inventarisiert
      - Verwundbarkeits- und Lizenzpruefung ist lokal und in GitHub reproduzierbar
      - Kritische Findings blockieren; Ausnahmen haben Owner und Ablaufdatum
      - GitHub Actions sind auf gepruefte Versionen oder Commit-SHAs festgelegt
    evidence:
      - docs/project/decisions/0026-reproducible-supply-chain-baseline.yaml
      - docs/project/compliance/supply-chain-policy.yaml
      - docs/project/gate-definitions/local/G-LOCAL-SUPPLY-CHAIN.yaml
      - scripts/quality/run_supply_chain_gate.sh
      - scripts/quality/install_flutter_ci.sh
      - scripts/quality/validate_supply_chain.rb
      - scripts/quality/test_supply_chain_gate.rb
      - .github/dependabot.yml
      - .github/dependency-review-config.yml
      - .github/workflows/quality-gates.yml
      - docs/project/audits/2026-07-28-code-quality-accessibility-ci-audit.md
      - https://github.com/MustDemir/ESG-Score-App/pull/9
      - https://github.com/MustDemir/ESG-Score-App/actions/runs/30440398821
      - https://github.com/MustDemir/ESG-Score-App/actions/runs/30440723805
      - https://github.com/MustDemir/ESG-Score-App/rules/19894816
    verification:
      - Zwoelf automatisierte Pass-/Fail-Tests fuer Pins, Findings, native Pakete, Ausnahmen und CI-Installer
      - Lokaler Scan inventarisiert 59 Dart-Pakete und 2 iOS-Plugins
      - Lokaler OSV-Scan meldet 0 bekannte Schwachstellen
      - Alle 16 Action-Referenzen verwenden volle Commit-SHAs
      - GitHub Dependabot Alerts und Security Updates sind aktiviert
      - GitHub meldet 0 offene Dependabot Alerts
      - flutter pub outdated meldet keine advisory-betroffenen oder zurueckgezogenen Pakete
      - PR #9 und Post-Merge-Run bestehen alle fuenf GitHub-Jobs
      - Repository-weites SHA-Pinning ist aktiviert
      - G-SUPPLY-CHAIN ist verpflichtender main-Statuscheck
      - Transitive Action-Pins werden durch GitHub erzwungen; Flutter-Archive werden vor jeder Extraktion verifiziert
    dependencies:
      - IMP-PROC-002
    next_action: Routinewartung ueber Dependabot und TODO-032; IMP-COMP-002 starten

  - id: IMP-COMP-002
    layer: compliance
    title: Risikobasierte OWASP-MASVS-Baseline fuer den iOS-MVP
    status: done
    priority: P0
    risk: H
    owner: Engineering
    target_profile: release_candidate
    rationale: |
      ADR 0008 nennt MASVS bereits als Referenz, uebersetzt die anwendbaren
      Kontrollen aber noch nicht vollstaendig in pruefbare MVP-Nachweise.
    acceptance_criteria:
      - Anwendbare MASVS-Kontrollgruppen sind fuer ScanFair klassifiziert
      - Nicht anwendbare Kontrollen sind mit Begruendung dokumentiert
      - Automatisierbare Kontrollen haben Tests oder Gates
      - Manuelle Device-Kontrollen haben Checkliste, Owner und Evidenzformat
    evidence:
      - docs/project/compliance/owasp-masvs-ios-baseline.yaml
      - docs/project/compliance/owasp-masvs-ios-manual-checklist.yaml
      - docs/project/gate-definitions/local/G-LOCAL-MASVS.yaml
      - scripts/quality/validate_masvs_baseline.rb
      - scripts/quality/test_masvs_gate.rb
      - scripts/quality/run_quality_gates.sh
    verification:
      - 24 MASVS-2.1-Kontrollen sind genau einmal erfasst; 9 anwendbar und 15 mit Aktivierungstrigger nicht anwendbar
      - Fuenf Validator-Selbsttests bestehen, einschliesslich fehlender Kontrolle und Release-Candidate-Blockade
      - Development-Profil besteht mit sichtbaren offenen Release-Nachweisen
      - Release-Candidate-Profil blockiert offene anwendbare MUST-Kontrollen und manuelle Checks
    dependencies:
      - IMP-COMP-001
    next_action: Baseline bei neuen Capabilities reklassifizieren und die manuellen Checks vor jedem Release Candidate ausfuehren

  - id: IMP-COMP-003
    layer: compliance
    title: Apple-, Datenschutz-, Rechte- und Claim-Evidenz schliessen
    status: in_progress
    priority: P0
    risk: H
    owner: Mustafa Demir
    target_profile: release_candidate
    rationale: |
      Die acht Apple-Gate-Gruppen sind technisch vorhanden, enthalten fuer
      Release Candidate aber bewusst noch offene manuelle und rechtliche
      MUST-Nachweise.
    acceptance_criteria:
      - Alle anwendbaren Apple-MUST-Anforderungen besitzen aktuelle Evidenz
      - Privacy Policy, Support, Attribution und App-Metadaten sind versioniert
      - Produkt- und ESG-Claims zeigen Methodik, Unsicherheit und Grenzen
      - Signiertes Release-Archive besteht Build- und SDK-Integritaetspruefung
    evidence:
      - docs/project/compliance/apple-compliance-control-model.md
      - docs/project/compliance/compliance-manifest.json
      - docs/project/compliance/ios-privacy-sdk-review.json
      - docs/privacy.md
    verification:
      - COMPLIANCE_PROFILE=release_candidate ohne offene anwendbare MUST-Findings
    dependencies:
      - IMP-COMP-001
      - IMP-COMP-002
    next_action: Offene Release-Evidenz pro Apple-Gate priorisieren und einzeln schliessen

  - id: IMP-DEV-001
    layer: development
    title: Kaffee als evidence-first vertikalen Referenzfall fertigstellen
    status: in_progress
    priority: P1
    risk: H
    owner: Mustafa Demir
    target_profile: development
    rationale: |
      Ein realer Referenzfall prueft Produkt-, Rohstoff-, Herkunfts-,
      Umwelt-, Social-, Governance- und Claim-Vertraege Ende-zu-Ende.
    acceptance_criteria:
      - Pilotprodukte und EANs sind festgelegt und reproduzierbar abrufbar
      - Produkt-Rohstoff-Herkunftsbeziehungen beruhen auf geeigneter Evidenz
      - Umwelt-, Social- und Governance-Faktoren zeigen Quelle und Confidence
      - Ergebnis- und Detailansicht erklaeren Score, Unsicherheit und Datenluecken
      - Derselbe Evidenzstand erzeugt denselben versionierten Score-Snapshot
    evidence:
      - docs/project/methodology-catalog/profiles/coffee.yaml
      - docs/project/methodology-catalog/source-mappings/agribalyse-v3.2.yaml
      - docs/project/data/environmental-source-assessment.yaml
    verification:
      - Kaffee-Fixtures und App-Tests bestehen
      - Scoring-Safety-Gates bestehen
    dependencies:
      - IMP-COMP-001
      - IMP-COMP-002
    next_action: Pilotprodukte festlegen und belastbare Rohstoff-Herkunftslinks aufbauen

  - id: IMP-DEV-002
    layer: development
    title: EU-Supabase, Server-Writer und read-only Flutter-Cache
    status: planned
    priority: P1
    risk: H
    owner: Engineering
    target_profile: development
    rationale: |
      Externe Quelldaten und Score-Snapshots duerfen nicht durch den
      Mobile-Client manipuliert werden; das lokale RLS-Modell braucht eine
      kontrollierte Remote-Entsprechung.
    acceptance_criteria:
      - Getrenntes EU-Development-Projekt mit Region- und AVV-Evidenz existiert
      - Migrationen sind reproduzierbar und RLS-Tests bestehen remote-nah
      - Nur vertrauenswuerdiger Server-Writer schreibt Evidenz und Scores
      - Flutter liest freigegebene Snapshots und verwendet einen sicheren Cache
      - Secrets und Service-Role-Schluessel gelangen nie in die App
    evidence:
      - docs/project/data/data-architecture.md
      - supabase/migrations/20260727000100_initial_data_architecture.sql
      - supabase/tests/database/data_architecture.test.sql
    verification:
      - G-DATA-ARCH und G-DATA-RLS bestehen
      - Integrations- und Offline-/Fehlerfalltests bestehen
    dependencies:
      - IMP-DEV-001
    next_action: Environment-, Secret- und Datenschutzvertrag fuer das EU-Development-Projekt definieren

  - id: IMP-OPS-001
    layer: operations
    title: Betriebs- und Release-Readiness vor TestFlight
    status: planned
    priority: P1
    risk: H
    owner: Mustafa Demir
    target_profile: submission
    rationale: |
      Ein technisch fertiger Build reicht ohne Restore-, Monitoring-,
      Incident-, Support- und Rollbacknachweise nicht fuer einen kontrollierten
      externen Test oder App-Store-Release.
    acceptance_criteria:
      - Development, Staging und Production sind getrennt
      - Backup, Restore, Migration und Rollback sind getestet
      - Datenschutzfreundliches Crash-, API- und Datenfrische-Monitoring existiert
      - Incident-, Support- und Datenkorrekturprozess sind dokumentiert
      - TestFlight- und Submission-Checklisten besitzen nachvollziehbare Evidenz
    evidence: []
    verification:
      - Submission-Profil und operativer Release-Drill bestehen
    dependencies:
      - IMP-COMP-003
      - IMP-DEV-002
    next_action: Erst nach stabilem Release Candidate einen Betriebs-Readiness-Schnitt planen
