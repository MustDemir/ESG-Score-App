schema_version: "1.0"
last_updated: 2026-08-11
owner: Mustafa Demir
purpose: |
  Zentrales Register der aus der Gesamtbewertung abgeleiteten Verbesserungen.
  Es verbindet Prozess, Compliance, Entwicklung und Betrieb mit pruefbaren
  Akzeptanzkriterien, Evidenz und einer eindeutigen Umsetzungsreihenfolge.

allowed_values:
  layers:
    - process
    - compliance
    - development
    - operations
  statuses:
    - planned
    - in_progress
    - draft
    - review
    - done
    - parked
    - dropped
  priorities:
    - P0
    - P1
    - P2
    - P3
  risks:
    - L
    - M
    - H
  target_profiles:
    - development
    - release_candidate
    - submission

execution_order:
  - IMP-PROC-003
  - IMP-COMP-004
  - IMP-COMP-005
  - IMP-COMP-006
  - IMP-COMP-007
  - IMP-DEV-001
  - IMP-DEV-003
  - IMP-DEV-002
  - IMP-DEV-004
  - IMP-COMP-003
  - IMP-OPS-001
  - IMP-OPS-002

improvements:
  - id: IMP-PROC-001
    layer: process
    title: Verbindliches Delivery Operating Model und geschuetzter main-Branch
    status: done
    priority: P0
    risk: H
    owner: Mustafa Demir
    target_profile: development
    rationale: |
      Aenderungen muessen risikobasiert, nachvollziehbar und nur nach
      reproduzierbaren Quality Gates integriert werden.
    acceptance_criteria:
      - Operating Model mit vier Ebenen, DoR, DoD und Gate-Aufnahmeregel ist versioniert
      - Pull Requests erfassen Risiko, Evidenz, offene Punkte und Rollback
      - main verlangt Pull Request und alle vier GitHub-Statuschecks
      - Force-Push, Branch-Loeschung und Owner-Bypass sind ausgeschlossen
    evidence:
      - docs/project/delivery-operating-model.md
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/workflows/quality-gates.yml
      - https://github.com/MustDemir/ESG-Score-App/rules/19894816
      - https://github.com/MustDemir/ESG-Score-App/pull/7
    verification:
      - GitHub Ruleset Protect main ist active
      - Post-Merge Quality-Gate-Run 30357533047 ist erfolgreich
    dependencies: []
    next_action: Keine; Regeln bei geaenderten GitHub-Jobnamen mitpflegen

  - id: IMP-PROC-002
    layer: process
    title: Verbesserungsregister und Projektstatus als pruefbare SSOT
    status: done
    priority: P0
    risk: M
    owner: Mustafa Demir
    target_profile: development
    rationale: |
      Bewertungsergebnisse waren ueber README, Feature-States, Roadmap und
      Operating Model verteilt und konnten dadurch widerspruechlich werden.
    acceptance_criteria:
      - Alle priorisierten Verbesserungsvorschlaege haben ID, Owner und Status
      - Akzeptanzkriterien, Evidenz, Abhaengigkeiten und naechste Aktion sind erfasst
      - Feature-Uebersicht entspricht den jeweiligen state.yaml-Dateien
      - Ein lokales und in GitHub ausgefuehrtes Gate blockiert Strukturdrift
    evidence:
      - docs/project/improvement-register.yaml
      - docs/project/features/README.md
      - scripts/quality/validate_project_control.rb
      - docs/project/gate-definitions/local/G-LOCAL-PROJECT-CONTROL.yaml
      - https://github.com/MustDemir/ESG-Score-App/pull/8
    verification:
      - G-PROJECT-CONTROL lokal erfolgreich
      - Gesamte lokale Quality-Gate-Pipeline erfolgreich
      - Post-Merge Quality-Gate-Run 30372528843 erfolgreich
    dependencies:
      - IMP-PROC-001
    next_action: Keine; Register und Validator bei neuen Statusfeldern gemeinsam pflegen

  - id: IMP-PROC-003
    layer: process
    title: Wiederholbare Lifecycle-Gap-Analyse und Compliance-Horizon-Review
    status: in_progress
    priority: P0
    risk: H
    owner: Mustafa Demir
    target_profile: development
    rationale: |
      Ein umfangreiches Handbuch kann blinde Flecken nicht allein verhindern.
      Fehlende, partielle, nicht operationalisierte und veraltete Kontrollen
      muessen systematisch gefunden, priorisiert und bis zur Evidenz verfolgt
      werden.
    acceptance_criteria:
      - Zwölf Prüffelder, acht Lifecycle-Phasen und Reifegrad 0 bis 5 sind versioniert
      - Gap-Register besitzt Owner, Priorität, Zielprofil, Trigger und Closure-Kriterien
      - P0- und P1-Gaps sind auf Improvements und Risiken rückverfolgbar
      - Überfällige Full- und Compliance-Source-Reviews werden maschinell erkannt
      - Capability-Trigger für Account, Payment, UGC, Analytics, Standort und AI sind Teil von DoR und DoD
    evidence:
      - docs/project/methodology/gap-analysis-process.md
      - docs/project/gap-register.yaml
      - docs/project/audits/2026-08-10-product-engineering-gap-analysis.md
      - docs/project/gate-definitions/gate-definition-schema.yaml
      - docs/project/gate-definitions/local/G-GATE-DEFINITION-QUALITY.yaml
      - scripts/quality/validate_gate_definitions.rb
    verification:
      - G-PROJECT-CONTROL validiert Gap-Struktur und Cross-Links
      - Vollständiger Audit wird bei Phasenwechsel und mindestens quartalsweise wiederholt
    dependencies:
      - IMP-PROC-002
    next_action: Legacy-Gate-Metadaten schrittweise auf scanfair-gate-v1 migrieren und weitere externe Quellen in die Freshness-Ueberwachung aufnehmen

  - id: IMP-COMP-001
    layer: compliance
    title: Reproduzierbarer Dependency- und Supply-Chain-Scan
    status: done
    priority: P0
    risk: H
    owner: Engineering
    target_profile: development
    rationale: |
      Flutter-, CocoaPods- und GitHub-Action-Abhaengigkeiten muessen auf
      bekannte Schwachstellen, unerwartete Updates und Lizenzrisiken geprueft
      werden.
    acceptance_criteria:
      - Flutter- und native iOS-Abhaengigkeiten sind inventarisiert
      - Verwundbarkeits- und Lizenzpruefung ist lokal und in GitHub reproduzierbar
      - Kritische Findings blockieren; Ausnahmen haben Owner und Ablaufdatum
      - GitHub Actions sind auf gepruefte Versionen oder Commit-SHAs festgelegt
    evidence:
      - docs/project/decisions/0026-reproducible-supply-chain-baseline.yaml
      - docs/project/compliance/supply-chain-policy.yaml
      - docs/project/gate-definitions/local/G-LOCAL-SUPPLY-CHAIN.yaml
      - scripts/quality/run_supply_chain_gate.sh
      - scripts/quality/install_flutter_ci.sh
      - scripts/quality/validate_supply_chain.rb
      - scripts/quality/test_supply_chain_gate.rb
      - .github/dependabot.yml
      - .github/dependency-review-config.yml
      - .github/workflows/quality-gates.yml
      - docs/project/audits/2026-07-28-code-quality-accessibility-ci-audit.md
      - https://github.com/MustDemir/ESG-Score-App/pull/9
      - https://github.com/MustDemir/ESG-Score-App/actions/runs/30440398821
      - https://github.com/MustDemir/ESG-Score-App/actions/runs/30440723805
      - https://github.com/MustDemir/ESG-Score-App/rules/19894816
    verification:
      - Zwoelf automatisierte Pass-/Fail-Tests fuer Pins, Findings, native Pakete, Ausnahmen und CI-Installer
      - Lokaler Scan inventarisiert 59 Dart-Pakete und 2 iOS-Plugins
      - Lokaler OSV-Scan meldet 0 bekannte Schwachstellen
      - Alle 16 Action-Referenzen verwenden volle Commit-SHAs
      - GitHub Dependabot Alerts und Security Updates sind aktiviert
      - GitHub meldet 0 offene Dependabot Alerts
      - flutter pub outdated meldet keine advisory-betroffenen oder zurueckgezogenen Pakete
      - PR #9 und Post-Merge-Run bestehen alle fuenf GitHub-Jobs
      - Repository-weites SHA-Pinning ist aktiviert
      - G-SUPPLY-CHAIN ist verpflichtender main-Statuscheck
      - Transitive Action-Pins werden durch GitHub erzwungen; Flutter-Archive werden vor jeder Extraktion verifiziert
    dependencies:
      - IMP-PROC-002
    next_action: Routinewartung ueber Dependabot und TODO-032; IMP-COMP-002 starten

  - id: IMP-COMP-002
    layer: compliance
    title: Risikobasierte OWASP-MASVS-Baseline fuer den iOS-MVP
    status: done
    priority: P0
    risk: H
    owner: Engineering
    target_profile: release_candidate
    rationale: |
      ADR 0008 nennt MASVS bereits als Referenz, uebersetzt die anwendbaren
      Kontrollen aber noch nicht vollstaendig in pruefbare MVP-Nachweise.
    acceptance_criteria:
      - Anwendbare MASVS-Kontrollgruppen sind fuer ScanFair klassifiziert
      - Nicht anwendbare Kontrollen sind mit Begruendung dokumentiert
      - Automatisierbare Kontrollen haben Tests oder Gates
      - Manuelle Device-Kontrollen haben Checkliste, Owner und Evidenzformat
    evidence:
      - docs/project/compliance/owasp-masvs-ios-baseline.yaml
      - docs/project/compliance/owasp-masvs-ios-manual-checklist.yaml
      - docs/project/gate-definitions/local/G-LOCAL-MASVS.yaml
      - scripts/quality/validate_masvs_baseline.rb
      - scripts/quality/test_masvs_gate.rb
      - scripts/quality/run_quality_gates.sh
    verification:
      - 24 MASVS-2.1-Kontrollen sind genau einmal erfasst; 9 anwendbar und 15 mit Aktivierungstrigger nicht anwendbar
      - Fuenf Validator-Selbsttests bestehen, einschliesslich fehlender Kontrolle und Release-Candidate-Blockade
      - Development-Profil besteht mit sichtbaren offenen Release-Nachweisen
      - Release-Candidate-Profil blockiert offene anwendbare MUST-Kontrollen und manuelle Checks
    dependencies:
      - IMP-COMP-001
    next_action: Baseline bei neuen Capabilities reklassifizieren und die manuellen Checks vor jedem Release Candidate ausfuehren

  - id: IMP-COMP-003
    layer: compliance
    title: Apple-, Datenschutz-, Rechte- und Claim-Evidenz schliessen
    status: in_progress
    priority: P0
    risk: H
    owner: Mustafa Demir
    target_profile: release_candidate
    rationale: |
      Die acht Apple-Gate-Gruppen sind technisch vorhanden, enthalten fuer
      Release Candidate aber bewusst noch offene manuelle und rechtliche
      MUST-Nachweise.
    acceptance_criteria:
      - Alle anwendbaren Apple-MUST-Anforderungen besitzen aktuelle Evidenz
      - Privacy Policy, Support, Attribution und App-Metadaten sind versioniert
      - Produkt- und ESG-Claims zeigen Methodik, Unsicherheit und Grenzen
      - Accessibility Nutrition Labels entsprechen einem vollständigen Common-Task-Audit
      - Signiertes Release-Archive besteht Build- und SDK-Integritaetspruefung
    evidence:
      - docs/project/compliance/apple-compliance-control-model.md
      - docs/project/compliance/compliance-manifest.json
      - docs/project/compliance/ios-privacy-sdk-review.json
      - docs/privacy.md
    verification:
      - COMPLIANCE_PROFILE=release_candidate ohne offene anwendbare MUST-Findings
    dependencies:
      - IMP-COMP-001
      - IMP-COMP-002
      - IMP-COMP-004
      - IMP-COMP-005
      - IMP-COMP-006
    next_action: Nach Claims-, Lizenz- und Privacy-Grundentscheidungen offene Release-Evidenz pro Apple-Gate einzeln schliessen

  - id: IMP-COMP-004
    layer: compliance
    title: Umwelt-, Nachhaltigkeits- und Health-Claim-Governance
    status: in_progress
    priority: P0
    risk: H
    owner: Mustafa Demir
    target_profile: release_candidate
    rationale: |
      Score, Ampel, Einkaufsorientierung und Health-Hinweis koennen als
      kommerzielle Umwelt-, Nachhaltigkeits-, Nutrition- oder Health-Aussage
      verstanden werden. Technische Evidenz und Disclaimer ersetzen keine
      fachliche und rechtliche Zulässigkeitspruefung.
    acceptance_criteria:
      - Claim-Inventar umfasst App, App Store, Webseite und Marketing
      - Claims sind nach Umwelt, Nachhaltigkeit, Social, Governance, Nutrition und Health klassifiziert
      - Jede Aussage ist an spezifische Evidenz, Methodikversion und Confidence gebunden
      - EU-Richtlinie 2024/825 und Health-Claims-Regelwerk sind auf Anwendbarkeit geprüft
      - Qualifiziertes Rechts- und Fachreview ist vor öffentlicher Aktivierung dokumentiert
    evidence:
      - docs/project/audits/2026-08-10-product-engineering-gap-analysis.md
      - docs/project/compliance/source-register.yaml
      - docs/project/gate-definitions/local/G-CLAIM-SAFETY.yaml
      - docs/project/audits/2026-08-11-claims-privacy-boundaries-assessment.md
      - docs/project/compliance/claim-inventory.yaml
      - docs/project/decisions/0031-claims-and-privacy-boundaries.yaml
      - docs/project/gate-definitions/local/G-CLAIM-GOVERNANCE.yaml
      - scripts/quality/test_claims_privacy_gate.rb
      - esg_app/test/widgets/nutrition_information_card_test.dart
    verification:
      - G-CLAIM-SAFETY blockiert nicht belegte oder zu starke In-App-Claims
      - G-CLAIM-GOVERNANCE Development-Profil und Gate-Selbsttests bestehen
      - External-Beta- und Release-Profile blockieren bis Rechts- und Fachreview
    dependencies:
      - IMP-PROC-003
    next_action: Score kalibrieren, Webseiten-Snapshot inventarisieren und qualifiziertes Rechts-/Fachreview mit Hash-Evidenz beauftragen

  - id: IMP-COMP-005
    layer: compliance
    title: Datenlizenz-Komposition und produktive Trennungsarchitektur
    status: in_progress
    priority: P0
    risk: H
    owner: Mustafa Demir
    target_profile: development
    rationale: |
      OFF steht unter ODbL mit Attribution und Share-Alike. Eine kombinierte
      Datenbank mit proprietären oder anders lizenzierten Quellen kann
      Pflichten oder Inkompatibilitäten auslösen, die vor dem Remote-Backend
      technisch und rechtlich entschieden werden muessen.
    acceptance_criteria:
      - Database-, Content- und Bildrechte sind je Quelle getrennt inventarisiert
      - Produced Work, Derivative Database und Collective Database sind bewertet
      - Inkompatible Datensätze werden logisch oder physisch getrennt
      - Attribution, Export, Share-Alike und Löschung sind als Datenvertrag testbar
      - Rechtsreview und ADR bestimmen die Produktionsarchitektur
    evidence:
      - docs/project/data/source-register.yaml
      - docs/project/compliance/source-register.yaml
      - docs/project/audits/2026-08-10-product-engineering-gap-analysis.md
      - docs/project/audits/2026-08-11-data-license-composition-assessment.md
      - docs/project/data/license-composition-policy.yaml
      - docs/project/decisions/0030-data-license-composition.yaml
      - docs/project/gate-definitions/local/G-DATA-LICENSE.yaml
      - supabase/migrations/20260811000100_data_license_composition.sql
    verification:
      - G-DATA-ARCH validiert Lizenzklasse und erlaubte Speichergrenze
      - G-DATA-LICENSE Development-Profil validiert Quellentrennung und Attribution
      - Negative Gate-Tests beweisen, dass Remote ohne Review, Export und Loeschung blockiert
      - Architektur- und Rechtsreview bestätigen die Remote-Datenbank vor Provisionierung
    dependencies:
      - IMP-PROC-003
    next_action: Qualifiziertes Rechtsreview beauftragen und danach Share-Alike-Export sowie Korrektur/Loeschung implementieren

  - id: IMP-COMP-006
    layer: compliance
    title: Datenschutz-Betriebsmodell und Data-Protection-Readiness
    status: in_progress
    priority: P0
    risk: H
    owner: Mustafa Demir
    target_profile: release_candidate
    rationale: |
      RLS und Privacy Manifest kontrollieren technische Teile, aber ein
      Remote- oder Beta-Betrieb braucht zusätzlich Datenfluss,
      Rechtsgrundlagen, Aufbewahrung, Betroffenenrechte, AVV,
      Incident-Verfahren und eine dokumentierte DPIA-Entscheidung.
    acceptance_criteria:
      - Dateninventar und Datenfluss sind vollständig und versioniert
      - Rechtsgrundlage, Zweck, Empfänger, Region und Löschfrist sind je Datentyp dokumentiert
      - AVV und Drittparteienprüfung sind abgeschlossen
      - Auskunft, Export, Löschung und Incident-Ablauf sind getestet
      - DPIA-Erforderlichkeitsentscheidung und Privacy Policy sind reviewt
    evidence:
      - docs/project/compliance/dsgvo-relevance.md
      - docs/project/compliance/source-register.yaml
      - docs/project/audits/2026-08-10-product-engineering-gap-analysis.md
      - docs/project/audits/2026-08-11-claims-privacy-boundaries-assessment.md
      - docs/project/compliance/privacy-data-inventory.yaml
      - docs/project/compliance/privacy-data-flow.md
      - docs/privacy.md
      - docs/project/decisions/0031-claims-and-privacy-boundaries.yaml
      - docs/project/gate-definitions/local/G-PRIVACY-BOUNDARY.yaml
      - scripts/quality/test_claims_privacy_gate.rb
      - docs/project/compliance/provider-governance-register.yaml
      - docs/project/decisions/0035-forward-only-remote-schema-hardening.yaml
      - docs/project/audits/2026-08-17-remote-schema-state-assessment.md
      - supabase/migrations/20260817000100_backend_remote_readiness.sql
      - supabase/tests/database/backend_remote_readiness.test.sql
      - docs/project/gate-definitions/local/G-PROVIDER-DPA.yaml
      - docs/project/gate-definitions/local/G-PROVIDER-SUBPROCESSORS.yaml
      - docs/project/audits/2026-08-12-provider-governance-gates-assessment.md
    verification:
      - G-PRIVACY-BOUNDARY Development-Profil und Gate-Selbsttests bestehen
      - Provider-DPA- und Subprocessor-Development-Gates validieren Quellen, Fristen und fail-closed Status
      - External-Beta-, Remote- und Release-Profile blockieren offene Evidenz
      - Datenfluss und App Store Privacy Details stimmen vor Freigabe mit Build und Backend überein
    dependencies:
      - IMP-PROC-003
    next_action: DPA-/Subprocessor-Owner-Entscheidung und Aenderungsabonnement belegen; danach Rechtsgrundlagen, DPIA, App Privacy, Rechte-, Loesch- und Incident-Prozesse operationalisieren

  - id: IMP-COMP-007
    layer: compliance
    title: End-to-End-Threat-Model und Backend-Abuse-Sicherheitsprüfung
    status: in_progress
    priority: P1
    risk: H
    owner: Engineering
    target_profile: development
    rationale: |
      MASVS deckt die Mobile-App ab. Der geplante Server-Writer und Adminpfad
      brauchen eigene Trust Boundaries, Abuse Cases, Rate Limits,
      Manipulationsschutz und einen risikobasierten Security-Test.
    acceptance_criteria:
      - Systemdatenfluss und Trust Boundaries sind diagrammiert
      - Assets, Angreifer, Bedrohungen und Abuse Cases sind priorisiert
      - AuthN/AuthZ, Input Validation, Rate Limits, Replay- und Kostenmissbrauch sind getestet
      - Secret Rotation, Audit Trail und Break-glass-Zugriff sind dokumentiert
      - Bedarf und Scope eines unabhängigen Penetrationstests sind entschieden
    evidence:
      - docs/project/compliance/owasp-masvs-ios-baseline.yaml
      - docs/project/audits/2026-08-10-product-engineering-gap-analysis.md
      - docs/project/security/backend-threat-model.yaml
      - docs/project/security/backend-threat-model.md
      - docs/project/security/eu-supabase-environment-contract.yaml
      - docs/project/audits/2026-08-11-backend-threat-model-assessment.md
      - docs/project/gate-definitions/local/G-BACKEND-BOUNDARY.yaml
      - scripts/quality/test_backend_boundary_gate.rb
      - supabase/functions/_shared/writer_contract.test.mjs
      - supabase/migrations/20260812000100_trusted_writer_cache_path.sql
      - supabase/tests/database/trusted_writer_cache_path.test.sql
      - docs/project/audits/2026-08-12-eu-supabase-local-integration-assessment.md
    verification:
      - Threat-Model-Review vor Implementierung des Remote-Writers
      - Security-Tests und G-DATA-RLS bestehen gegen die Zielarchitektur
    dependencies:
      - IMP-PROC-003
      - IMP-COMP-001
      - IMP-COMP-002
    next_action: Unabhaengigen Security-Review oder risikobasierten Penetrationstest entscheiden und danach Remote-Integration, Rotation und Incident Drill belegen

