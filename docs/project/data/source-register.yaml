  - id: eu-eudr-country-benchmarking
    status: candidate
    role: regulatory_deforestation_country_context
    legal_basis: Commission Implementing Regulation EU 2025/1093
    activation_requires:
      - current_legal_version_check_automated
      - product_commodity_and_origin_mapping_validated
      - risk_not_product_finding_claim_enforced
      - bananas_explicitly_excluded_from_eudr_mapping
  - id: faostat-emissions-intensities
    status: rejected_for_pilot_profiles
    reason: |
      The October 2025 domain covers selected cereals and animal products,
      but not coffee, cocoa or bananas. It is not a full life-cycle dataset.
  - id: social-country-risk
    status: candidate
    activation_requires:
      - authoritative_dataset_selected
      - country_mapping_and_versioning_validated
      - redistribution_compatible_with_odbl
      - methodology_version_updated
  - id: governance-company-reporting
    status: candidate
    activation_requires:
      - authoritative_dataset_selected
      - brand_to_legal_entity_resolution_validated
      - claims_review_completed
      - methodology_version_updated
