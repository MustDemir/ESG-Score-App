      - machine_access_path_and_terms_reviewed
      - jurisdiction_identifier_mapping_validated
      - no_unverified_name_only_match
  - id: us-dol-ilab-goods-list
    status: candidate
    role: contextual_commodity_country_child_and_forced_labor_risk
    official_reference: https://www.dol.gov/agencies/ilab/reports/child-labor/list-of-goods
