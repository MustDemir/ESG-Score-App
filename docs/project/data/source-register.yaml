version: "1.0"
last_updated: "2026-07-27"
owner: "ScanFair"

integration_rules:
  - Every score-relevant fact must retain source, source field, record ID,
    retrieval time, quality class and license.
  - Source data and ScanFair-derived scores must remain distinguishable.
  - A new source must pass technical, methodological and license review before
    activation.
  - Data must not be combined into a reusable database until license
    compatibility and redistribution duties are documented.

sources:
  - id: open-food-facts
    name: Open Food Facts
    status: active
    role: primary_product_source
    api:
      family: v3
      latest_reviewed_subversion: "3.6"
      product_schema_version: response_field
      endpoint: https://world.openfoodfacts.org/api/v3/product/{barcode}.json
      authentication: none_for_read
      user_agent_required: true
      product_read_rate_limit: 15_per_minute_per_ip
    license:
      database: ODbL-1.0
      contents: Database Contents License
      images: CC-BY-SA
      attribution: Open Food Facts contributors
      share_alike_review_required: true
      terms: https://world.openfoodfacts.org/terms-of-use
    quality:
      class: community_and_source_calculated
      limitations:
        - completeness_not_guaranteed
        - correctness_not_guaranteed
        - schema_changes_over_time
    reviewed_on: "2026-07-27"
    review_due: "2026-10-27"

  - id: agribalyse
    name: AGRIBALYSE
    status: active
    role: authoritative_environmental_lca_reference
    release:
      version: "3.2"
      persistent_id: doi:10.57745/XTENSJ
      official_dataset: https://entrepot.recherche.data.gouv.fr/dataset.xhtml?persistentId=doi:10.57745/XTENSJ
      summary_csv: https://www.data.gouv.fr/api/1/datasets/r/41397293-3e85-4959-8936-940bb79d91fc
      record_url_template: https://agribalyse.ademe.fr/app/aliments/{agribalyse_code}
    delivery:
      canonical: official_bulk_dataset
      current_app_channel: open-food-facts
      channel_fields:
        - environmental_score_data.agribalyse
        - ecoscore_data.agribalyse
    license:
      database: Etalab-2.0
      attribution: Source ADEME, AGRIBALYSE v3.2
      commercial_reuse_allowed: true
      derived_information_allowed: true
      terms: https://doc.agribalyse.fr/documentation/utiliser-agribalyse/precautions-et-conditions-dusage
    quality:
      class: official_lca_reference
      dqr_scale: 1_very_good_to_5_very_poor
      use_caution_above_dqr: 3
      limitations:
        - category_average_not_brand_product_measurement
        - simplified_data_cannot_compare_brands_within_one_category
        - not_sufficient_as_only_environmental_source
        - biodiversity_and_water_method_limitations
        - source_updates_every_18_to_24_months
    reviewed_on: "2026-07-27"
    review_due: "2026-10-27"

planned_sources:
  - id: gs1-traceability-standards
    status: reference_standard
    role: product_identity_and_supply_chain_interoperability
    scope:
      - gtin_product_identity
      - gln_party_and_location_identity
      - epcis_traceability_events
      - digital_link_resolution
    official_reference: https://www.gs1.org/standards/traceability
    note: Reference architecture only; no GS1 dataset is currently ingested.
  - id: gleif-lei
    status: candidate
    role: legal_entity_and_ownership_resolution
    official_api: https://www.gleif.org/en/lei-data/gleif-api
    activation_requires:
      - API_and_bulk_data_terms_reviewed
      - brand_to_legal_entity_matching_benchmark_created
      - ambiguous_matches_require_manual_review
