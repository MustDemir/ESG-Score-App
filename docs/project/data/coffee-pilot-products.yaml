purpose: |
  Reproducible local reference set for testing product identity, coffee
  commodity assignment and product-scoped commodity origin. The fixture does
  not activate methodology 2.0 weights or contextual risk scores.

safeguards:
  - Open Food Facts country tags describe markets, not commodity origin.
  - GEPA origin declarations are manufacturer statements, not independent audits.
  - Every commodity-origin relationship is scoped to its GTIN product entity.
  - Missing environmental evidence blocks the overall ESG score.
  - Child-labor, forced-labor, water and deforestation risk joins remain inactive.

