done:
  - |
    2026-07-08 — Handgeschriebene Product- und ESGScore-Modelle implementiert
    (Freezed bewusst deferred, siehe ADR 0014).
  - |
    2026-07-08 — ESGScoreCalculator nach ADR 0011 implementiert:
    E=50%, S=30%, G=20%, Transparenz-First bei fehlendem Eco-Score.
  - |
    2026-07-08 — DemoProductRepository mit lokalen OFF-aehnlichen Produktdaten
    und Alternative-Suggestion implementiert.
  - |
    2026-07-08 — Unit-Tests fuer Calculator, OFF-JSON-Mapping und Repository
    ergaenzt; flutter test PASS.
  - |
    2026-07-18 — Echter OpenFoodFactsService auf API v3 mit HTTPS,
    User-Agent, 8s Timeout, maximal 3 Retries und Fehlerklassifikation gebaut.
  - |
    2026-07-18 — Mapper akzeptiert environmental_score_* und Legacy-
    ecoscore_*-Felder; API- und Edge-Case-Tests ergaenzt.
  - |
    2026-07-27 — OFF-Mapping aus dem Domain-Modell in einen Source-Adapter
    verschoben. ESGEvidence haelt Quelle, Lizenz, Originalfeld, Qualitaet,
    Zeitstempel und Schema-Version; Score-Faktoren referenzieren Evidenz-IDs.
  - |
    2026-07-27 — Lokale Supabase-Migration mit RLS fuer Quellen, Produktcache,
    Evidenz, Score-Snapshots und private Scan-Historie angelegt. G-DATA-ARCH
    prueft Schema, RLS, Client-Rechte, OFF-Lizenz und Service-Key-Verbot.
  - |
    2026-07-27 — Methodikkatalog 2.0-draft mit 26 Parametern,
    Lebensmittel-Basisprofil und Pilotprofilen fuer Kaffee, Banane und
    Kakao/Schokolade definiert. Gewichte bleiben bis zur Quellenvalidierung
    ausgesetzt; Datenkonfidenz wird getrennt vom ESG-Score behandelt.
  - |
    2026-07-27 — Supabase um fuenf versionierte Methodiktabellen erweitert.
    51 pgTAP-Tests belegen RLS, server-only Schreibrechte und die
    Nicht-Sichtbarkeit von 2.0-draft fuer App-Clients.
  - |
    2026-07-27 — AGRIBALYSE 3.2 als offizielle LCA-Kategoriequelle
    registriert. E-GHG-INTENSITY uebernimmt Code, Klimawert und DQR aus dem
    von OFF transportierten Datensatz und speichert OFF als Retrieval-Channel.
    Das validierte Rohmapping ist noch nicht score-aktiv.
  - |
    2026-07-27 — Produkt, Rohstoff, Herkunft, Marke und Rechtstraeger werden
    als evidenzbasierte Beziehungen mit Assertion-Klasse und Confidence
    modelliert. Ein allgemeiner Produktherkunftshinweis wird nicht als
    Rohstoffherkunft verwendet; Community- und Inference-Links bleiben
    score-ineligible.
  - |
    2026-07-27 — G-LINK-INTEGRITY, G-MISSING-DATA, G-RED-FLAG,
    G-SCORE-REPRO und G-CLAIM-SAFETY als blockierende lokale Gates integriert.
  - |
    2026-08-10 — ADR 0027 schliesst die Precedence-Luecke: Ein Gesamtscore
    benoetigt Environmental-Evidenz, waehrend S/G separat sichtbar bleiben.
    Eine 39-Faelle-Testmatrix deckt Saeulenkombinationen, Zweige, Clamping,
    nicht-endliche Eingaben und Ampelgrenzen ab.
  - |
    2026-08-10 — Drei Kaffee-Pilot-GTINs, offizielle Herstellerdeklarationen
    und produktgebundene Rohstoff-Herkunftslinks implementiert. ADR 0028
    verhindert, dass die Herkunft eines Kaffeeprodukts fuer ein anderes
    Produkt verwendet wird. Die Links bleiben ohne freigegebenes
    Quellenmapping und Environmental-Evidenz ohne Gesamtscore-Wirkung.

decisions:
  - id: FD-SCO-01
    decision: Eco-Score-Fallback = Transparenz-First (data_incomplete-State)
    date: "2026-05-19"
    rationale: "ADR 0010 — kein Greenwashing-Risiko via Heuristik"
    adr_ref: "0010"
  - id: FD-SCO-02
    decision: "ESG-Formel v1.0: E=50% / S=30% / G=20%"
    date: "2026-05-19"
    rationale: "ADR 0011 — gewichtete Säulen, E dominiert (Hauptthema)"
    adr_ref: "0011"
  - id: FD-SCO-03
    decision: OFF API v3 mit tolerantem Legacy-Feldmapping
    date: "2026-07-18"
    rationale: "Aktuell empfohlene API, ohne bestehende Fixtures zu brechen"
    adr_ref: "0016"
  - id: FD-SCO-04
    decision: Universeller Kern mit erbenden Kategorieprofilen
    date: "2026-07-27"
    rationale: "Vergleichbarkeit erhalten und Rohstoffmaterialitaet abbilden"
    adr_ref: "0023"
  - id: FD-SCO-05
    decision: AGRIBALYSE als Quelle und OFF als Retrieval-Channel modellieren
    date: "2026-07-27"
    rationale: "Upstream-Provenienz erhalten und Kategorieproxy offenlegen"
    adr_ref: "0024"
  - id: FD-SCO-06
    decision: ESG-Risiko-Joins benoetigen evidenzbasierte Subject Links
    date: "2026-07-27"
    rationale: "Produkt-, Rohstoff-, Herkunfts- und Unternehmensbezug getrennt pruefen"
    adr_ref: "0025"
  - id: FD-SCO-07
    decision: Environmental-Evidenz ist Voraussetzung fuer einen Gesamt-ESG-Score
    date: "2026-08-10"
    rationale: "Fehlende E-Evidenz darf nicht durch Social- oder Governance-Signale ersetzt werden"
    adr_ref: "0027"

