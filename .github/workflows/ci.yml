# ============================================================================
# ScanFair — CI/CD Pipeline
# ============================================================================
# Referenz: ADR 0007 (CI/CD/CT-Strategie), quality-strategy.md §3
# Aktiviert: Sprint 0 (Baseline). Erweitert in Sprint 1 (Coverage-Gate)
#            und Sprint 3 (TestFlight-Auto-Deploy).
# ============================================================================

name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'esg_app/**'
      - '.github/workflows/ci.yml'
      - 'pubspec.yaml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'esg_app/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Flutter-Check (analyze + format + test)
  # --------------------------------------------------------------------------
  flutter-check:
    name: "Flutter: analyze + format + test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esg_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check (fail on drift)
        run: dart format --set-exit-if-changed lib test

      - name: Analyze (fail on warnings)
        run: flutter analyze --fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Coverage summary
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "Coverage file generated."
            # Sprint 1+: Coverage-Gate hier hochziehen (lcov_cobertura oder Aktion)
          else
            echo "No coverage file (probably no tests). Skipping for Sprint 0."
          fi

  # --------------------------------------------------------------------------
  # Job 2: Secret-Scan (gitleaks)
  # --------------------------------------------------------------------------
  secret-scan:
    name: "Security: gitleaks"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE not required for public repos
