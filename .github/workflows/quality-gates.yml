name: Quality Gates

on:
  push:
    branches:
      - main
    paths:
      # G-DOC-TRACE validates the repository README as a release-relevant artifact.
      - 'README.md'
      - 'README.de.md'
      - 'esg_app/**'
      - 'docs/**'
      - 'supabase/**'
      - 'scripts/**'
      - '.github/**'
  pull_request:
    branches:
      - main
    paths:
      - 'README.md'
      - 'README.de.md'
      - 'esg_app/**'
      - 'docs/**'
      - 'supabase/**'
      - 'scripts/**'
      - '.github/**'
  schedule:
    # Monday 05:00 UTC; Dependabot uses the Europe/Berlin timezone separately.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      compliance_profile:
        description: Apple compliance enforcement profile
        required: true
        type: choice
        default: development
        options:
          - development
          - release_candidate
          - submission

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  FLUTTER_VERSION: '3.44.0'
  FLUTTER_RELEASE_BASE_URL: 'https://storage.googleapis.com/flutter_infra_release/releases'
  FLUTTER_LINUX_X64_SHA256: 'e1ec95e6c550458a34de93580cb85dac24da0e9bedb9bb42811f050ac5a0c7d5'
  FLUTTER_MACOS_X64_SHA256: '2e9efb651b333b201487c2ac213f910c717338483ca24cbf497a067b05f048e5'
  FLUTTER_MACOS_ARM64_SHA256: '0d4d1d3f379d18aff392291be6871d63bf090a9e81078d4c4bc84e6208603dca'
  CONFTEST_VERSION: '0.62.0'
  OPA_VERSION: '1.14.1'
  OPA_LINUX_AMD64_STATIC_SHA256: '8ffbe82aa8b3259c432ad21d9919d14b89dc2ad2e866c2cec3b2e5177c72cd7c'
  SUPABASE_CLI_VERSION: '2.110.0'
  CONFTEST_LINUX_AMD64_SHA256: '284231908e4cf66d156e5577c3eee2f67d9f2edf2521fa2309e0df1969f871e5'
  COMPLIANCE_PROFILE: ${{ inputs.compliance_profile || 'development' }}

jobs:
  local-quality-gates:
    name: Local CI quality gates
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore verified Flutter SDK
        id: flutter-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/flutter-archive
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-archive-v1

      - name: Install verified Flutter SDK
        run: bash scripts/quality/install_flutter_ci.sh

      - name: Enable Flutter Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Setup Ruby for YAML gate
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'

      - name: Install OPA
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --silent --show-error \
            -o "$RUNNER_TEMP/opa" \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          printf '%s  %s\n' "$OPA_LINUX_AMD64_STATIC_SHA256" "$RUNNER_TEMP/opa" | sha256sum --check -
          sudo install -m 0755 "$RUNNER_TEMP/opa" /usr/local/bin/opa
          opa version

      - name: Install Conftest
        run: |
          mkdir -p "$RUNNER_TEMP/conftest"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --silent --show-error \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            -o "$RUNNER_TEMP/conftest.tar.gz"
          printf '%s  %s\n' "$CONFTEST_LINUX_AMD64_SHA256" "$RUNNER_TEMP/conftest.tar.gz" | sha256sum --check -
          tar xzf "$RUNNER_TEMP/conftest.tar.gz" -C "$RUNNER_TEMP/conftest"
          sudo install -m 0755 "$RUNNER_TEMP/conftest/conftest" /usr/local/bin/conftest
          conftest --version

      - name: Run quality gates
        run: bash scripts/quality/run_quality_gates.sh

      - name: Publish quality gate summary
        if: always()
        run: |
          if [ -f .quality/quality-gate-report.md ]; then
            cat .quality/quality-gate-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload quality gate artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scanfair-quality-gate-results
          include-hidden-files: true
          path: |
            .quality/**
            esg_app/coverage/lcov.info
            evidence-store/app_extracted.json
            evidence-store/compliance_input.json
            evidence-store/evidence-log.jsonl
            evidence-store/latest-gate-results.json
            docs/project/compliance/source-register.yaml

  supply-chain-gate:
    name: G-SUPPLY-CHAIN dependency and Action security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore verified Flutter SDK
        id: flutter-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/flutter-archive
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-archive-v1

      - name: Install verified Flutter SDK
        run: bash scripts/quality/install_flutter_ci.sh

      - name: Enable Flutter Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'

      - name: Resolve locked Flutter dependencies
        working-directory: esg_app
        run: flutter pub get

      - name: Run reproducible supply-chain gate
        id: supply-chain
        run: bash scripts/quality/run_supply_chain_gate.sh

      - name: Review pull-request dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

      - name: Publish supply-chain summary
        if: always()
        run: |
          echo "## G-SUPPLY-CHAIN" >> "$GITHUB_STEP_SUMMARY"
          echo "OSV, license, native iOS plugin and immutable Action validation: **${{ steps.supply-chain.outcome }}**" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .quality/supply-chain/dependency-inventory.json ]; then
            jq -r '"Dart packages: **\(.dart_packages | length)**  \nNative iOS plugins: **\(.native_ios_plugins | length)**  \nPinned Action references: **\(.github_actions | length)**  \nKnown vulnerabilities: **\(.osv.reported_vulnerabilities)**"' \
              .quality/supply-chain/dependency-inventory.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scanfair-supply-chain-evidence
          include-hidden-files: true
          path: .quality/supply-chain/**

  ios-compile-gate:
    name: G-IOS-COMPILE native iOS build
    if: github.event_name != 'schedule'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore verified Flutter SDK
        id: flutter-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/flutter-archive
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-archive-v1

      - name: Install verified Flutter SDK
        run: bash scripts/quality/install_flutter_ci.sh

      - name: Enable Flutter Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Compile unsigned iOS simulator app
        id: ios-build
        run: bash scripts/quality/run_ios_build_gate.sh

      - name: Publish iOS gate summary
        if: always()
        run: |
          echo "## G-IOS-COMPILE" >> "$GITHUB_STEP_SUMMARY"
          echo "Native unsigned iOS simulator build and bundled privacy-manifest audit: **${{ steps.ios-build.outcome }}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS build and privacy evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scanfair-ios-simulator-app
          path: |
            esg_app/build/ios/iphonesimulator/Runner.app
            evidence-store/ios_privacy_audit.json
          retention-days: 7

  data-database-gate:
    name: G-DATA-RLS migration and policy tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
          github-token: ${{ github.token }}

      - name: Rebuild schema and run pgTAP tests
        id: database-tests
        run: bash scripts/quality/run_data_database_gate.sh

      - name: Run trusted writer Edge integration gate
        id: edge-writer-tests
        run: bash scripts/quality/run_edge_writer_integration_gate.sh

      - name: Publish database gate summary
        if: always()
        run: |
          {
            echo "## G-DATA-RLS"
            echo "Supabase migration replay, pgTAP RLS behavior tests and database lint: **${{ steps.database-tests.outcome }}**"
            echo "Trusted writer contract and local Edge authentication/schema smoke: **${{ steps.edge-writer-tests.outcome }}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend data-path evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scanfair-backend-data-path-evidence
          include-hidden-files: true
          path: .quality/edge-writer/**

  provider-governance-gates:
    name: G-PROVIDER-GOVERNANCE DPA, subprocessors and cost
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'

      - name: Validate gate-definition schema
        run: |
          ruby scripts/quality/test_gate_definition_gate.rb
          ruby scripts/quality/validate_gate_definitions.rb

      - name: Run provider-governance gates
        env:
          PROVIDER_GOVERNANCE_PROFILE: development
          PROVIDER_ONLINE_SOURCE_CHECK: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
        run: bash scripts/quality/run_provider_governance_gates.sh

      - name: Publish provider-governance summary
        if: always()
        run: |
          if [ -f .quality/provider-governance/report.md ]; then
            cat .quality/provider-governance/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .quality/gate-definitions/report.json ]; then
            jq -r '"\n## G-GATE-DEFINITION-QUALITY\n\nDecision: **\(.decision)**  \nDefinitions: **\(.counts.gates)**  \nCanonical: **\(.counts.canonical)**  \nCompatible legacy: **\(.counts.legacy_compatible)**"' \
              .quality/gate-definitions/report.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload provider-governance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scanfair-provider-governance-evidence
          include-hidden-files: true
          path: |
            .quality/provider-governance/**
            .quality/gate-definitions/**
            docs/project/compliance/provider-governance-register.yaml

  secret-scan:
    name: Secret scan gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
